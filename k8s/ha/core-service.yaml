apiVersion: v1
kind: Service
metadata:
  name: ella-core
  labels:
    app.kubernetes.io/name: ella-core
spec:
  selector:
    app: ella-core
  type: NodePort
  ports:
  - name: http
    protocol: TCP
    port: 5002
    targetPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: ella-core-cluster
  labels:
    app.kubernetes.io/name: ella-core
spec:
  selector:
    app: ella-core
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: cluster
    protocol: TCP
    port: 7000
    targetPort: 7000

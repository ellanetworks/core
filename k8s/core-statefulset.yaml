apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ella-core
spec:
  replicas: 1
  serviceName: ella-core
  selector:
    matchLabels:
      app: ella-core
  template:
    metadata:
      labels:
        app: ella-core
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {"name": "core-ran", "interface": "n3"}
          ]
    spec:
      containers:
      - name: core
        image: ghcr.io/ellanetworks/ella-core:v1.21.0
        command: ["core"]
        args: ["--config", "/config/config.yaml"]
        securityContext:
          capabilities:
            drop: ["ALL"]
            add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE", "BPF", "PERFMON", "SYS_RESOURCE"]
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 8Gi
        startupProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 150
        readinessProbe:
          httpGet:
            path: /api/v1/readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: data
          mountPath: /core/data
        ports:
        - name: http
          containerPort: 5002
      volumes:
      - name: config-volume
        configMap:
          name: core-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi

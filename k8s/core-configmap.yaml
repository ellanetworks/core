apiVersion: v1
kind: ConfigMap
metadata:
  name: core-config
data:
  config.yaml: |
    logging:
      system:
        level: "info"
        output: "stdout"
      audit:
        output: "stdout"
    db:
      path: /core/data/ella.db
    interfaces:
      n2:
        address: "192.168.252.3"
      n3:
        name: "n3"
      n6:
        name: "eth0"
      api:
        address: "0.0.0.0"
        port: 5002
    datapath:
      attach-mode: "tcx"

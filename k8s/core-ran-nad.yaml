apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: core-ran
spec:
  config: '{
    "cniVersion": "0.3.1",
    "name": "core-ran",
    "plugins": [
      {
        "type": "macvlan",
        "master": "eth1",
        "mode": "bridge",
        "ipam": {
          "type": "static",
          "addresses": [
            {"address": "192.168.252.3/24"}
          ]
        }
      },
      {
        "type": "tuning",
        "sysctl": {
          "net.ipv4.ip_forward": "1",
          "net.ipv6.conf.all.forwarding": "1"
        }
      }
    ]
  }'

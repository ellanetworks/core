logging:
  system:
    level: "debug"
    output: "stdout"
  audit:
    output: "stdout"
db:
  path: "/data/ella.db"
interfaces:
  n2:
    address: "10.100.0.11"
    port: 38412
  n3:
    address: "10.3.0.11"
  n6:
    name: "n6"
  api:
    address: "10.100.0.11"
    port: 5002
datapath:
  attach-mode: "xdp-generic"
cluster:
  enabled: true
  node-id: 1
  bind-address: "ella-core-1:7000"
  peers:
      - "ella-core-1:7000"
      - "ella-core-2:7000"
      - "ella-core-3:7000"

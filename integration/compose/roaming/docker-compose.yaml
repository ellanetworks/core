name: ella-roaming-hplmn

x-open5gs: &open5gs
  image: ${OPEN5GS_IMAGE:-ella-ims-e2e/open5gs:latest}
  restart: unless-stopped
  volumes:
    - ./config:/config:ro
    - ./certs:/certs:ro

services:
  mongodb:
    image: ${MONGO_IMAGE:-mongo:7.0}
    restart: unless-stopped
    networks:
      hplmn:
        aliases: [mongodb]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  provision:
    image: ${MONGO_IMAGE:-mongo:7.0}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./provision.js:/provision.js:ro
    entrypoint: ["mongosh", "--quiet", "mongodb://mongodb/open5gs", "/provision.js"]
    networks: [hplmn]
    restart: "no"

  nrf:
    <<: *open5gs
    entrypoint: ["open5gs-nrfd", "-c", "/config/nrf.yaml"]
    networks:
      hplmn:
        aliases: [nrf.5gc.mnc001.mcc001.3gppnetwork.org]

  udr:
    <<: *open5gs
    entrypoint: ["open5gs-udrd", "-c", "/config/udr.yaml"]
    depends_on:
      nrf:
        condition: service_started
      provision:
        condition: service_completed_successfully
    networks:
      hplmn:
        aliases: [udr.5gc.mnc001.mcc001.3gppnetwork.org]

  udm:
    <<: *open5gs
    entrypoint: ["open5gs-udmd", "-c", "/config/udm.yaml"]
    depends_on: [nrf]
    networks:
      hplmn:
        aliases: [udm.5gc.mnc001.mcc001.3gppnetwork.org]

  ausf:
    <<: *open5gs
    entrypoint: ["open5gs-ausfd", "-c", "/config/ausf.yaml"]
    depends_on: [nrf]
    networks:
      hplmn:
        aliases: [ausf.5gc.mnc001.mcc001.3gppnetwork.org]

  sepp:
    <<: *open5gs
    entrypoint: ["open5gs-seppd", "-c", "/config/sepp.yaml"]
    depends_on: [nrf]
    ports:
      - "${SEPP_HOST_BIND:-127.0.0.1}:${SEPP_HOST_PORT:-7777}:7777"
    extra_hosts:
      - "sepp1.5gc.mnc070.mcc999.3gppnetwork.org:${ELLA_HOST_IP:-host-gateway}"
      - "sepp2.5gc.mnc070.mcc999.3gppnetwork.org:${ELLA_HOST_IP:-host-gateway}"
      - "sepp3.5gc.mnc070.mcc999.3gppnetwork.org:${ELLA_HOST_IP:-host-gateway}"
    networks:
      hplmn:
        aliases: [sepp1.5gc.mnc001.mcc001.3gppnetwork.org]

networks:
  hplmn:
    driver: bridge

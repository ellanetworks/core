configs:
  smsc_config:
    content: |
      db:
        path: "/smsc.db"
      service_centre:
        address: "15550000000"
      diameter:
        origin_host: smsc.example.org
        origin_realm: example.org
        address: "2001:db8:1::15"
        port: 3868
      hss:
        realm: epc.mnc001.mcc001.3gppnetwork.org
        allowed_networks: ["2001:db8:1::/64"]
      numbering:
        country_code: "1"
      delivery:
        default_validity: 1h
        retry_intervals: [10m]
        attempt_timeout: 40s
        concurrency: 4
      api:
        address: "2001:db8:1::15"
        port: 5010

services:
  smsc:
    image: ghcr.io/ellanetworks/ella-smsc:latest
    configs:
      - source: smsc_config
        target: /smsc.yaml
    restart: unless-stopped
    networks:
      default:
        ipv6_address: 2001:db8:1::15

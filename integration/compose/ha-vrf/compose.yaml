services:
  ella-core-1:
    image: ella-core-vrf:latest
    restart: unless-stopped
    entrypoint: ["/bin/busybox", "sh", "/vrf-entrypoint.sh"]
    privileged: true
    environment:
      CORE_CONFIG: "/cfg/core.yaml"
      VRF_CP_IFACES: "eth0"
      VRF_UP_IFACES: "n3 n6"
      VRF_UP_ROUTES: ""
      VRF_MAIN_DEFAULT: "1"
    volumes:
      - ./cfg/node1:/cfg:ro
      - data1:/data
    ports:
      - "5002:5002"
    networks:
      cluster:
        driver_opts:
              com.docker.network.endpoint.ifname: eth0
        ipv4_address: 10.100.0.11
      n3:
        driver_opts:
              com.docker.network.endpoint.ifname: n3
        ipv4_address: 10.3.0.11
      n6:
        driver_opts:
              com.docker.network.endpoint.ifname: n6
        ipv4_address: 10.6.0.11
  ella-core-2:
    image: ella-core-vrf:latest
    restart: unless-stopped
    entrypoint: ["/bin/busybox", "sh", "/vrf-entrypoint.sh"]
    privileged: true
    environment:
      CORE_CONFIG: "/cfg/core.yaml"
      VRF_CP_IFACES: "eth0"
      VRF_UP_IFACES: "n3 n6"
      VRF_UP_ROUTES: ""
      VRF_MAIN_DEFAULT: "1"
    volumes:
      - ./cfg/node2:/cfg:ro
      - data2:/data
    ports:
      - "5003:5002"
    networks:
      cluster:
        driver_opts:
              com.docker.network.endpoint.ifname: eth0
        ipv4_address: 10.100.0.12
      n3:
        driver_opts:
              com.docker.network.endpoint.ifname: n3
        ipv4_address: 10.3.0.12
      n6:
        driver_opts:
              com.docker.network.endpoint.ifname: n6
        ipv4_address: 10.6.0.12
  ella-core-3:
    image: ella-core-vrf:latest
    restart: unless-stopped
    entrypoint: ["/bin/busybox", "sh", "/vrf-entrypoint.sh"]
    privileged: true
    environment:
      CORE_CONFIG: "/cfg/core.yaml"
      VRF_CP_IFACES: "eth0"
      VRF_UP_IFACES: "n3 n6"
      VRF_UP_ROUTES: ""
      VRF_MAIN_DEFAULT: "1"
    volumes:
      - ./cfg/node3:/cfg:ro
      - data3:/data
    ports:
      - "5004:5002"
    networks:
      cluster:
        driver_opts:
              com.docker.network.endpoint.ifname: eth0
        ipv4_address: 10.100.0.13
      n3:
        driver_opts:
              com.docker.network.endpoint.ifname: n3
        ipv4_address: 10.3.0.13
      n6:
        driver_opts:
              com.docker.network.endpoint.ifname: n6
        ipv4_address: 10.6.0.13

volumes:
  data1:
  data2:
  data3:

networks:
  cluster:
    ipam:
      config:
        - subnet: 10.100.0.0/24
  n3:
    internal: true
    ipam:
      config:
        - subnet: 10.3.0.0/24
  n6:
    ipam:
      config:
        - subnet: 10.6.0.0/24

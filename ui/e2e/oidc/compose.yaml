name: ella-core-oidc-e2e

configs:
  ella_config:
    content: |
      logging:
        system:
          level: "info"
          output: "stdout"
        audit:
          output: "stdout"
      db:
        path: "core.db"
      interfaces:
        n2:
          name: "n3"
        n3:
          name: "n3"
        n6:
          name: "n6"
        api:
          address: "0.0.0.0"
          port: 5002
          tls:
            cert: "/certs/core.pem"
            key: "/certs/core-key.pem"
      datapath:
        attach-mode: "xdp-generic"

services:
  ella-core:
    image: ${ELLA_CORE_IMAGE:-ella-core:latest}
    configs:
      - source: ella_config
        target: /core.yaml
    entrypoint: /bin/core --config /core.yaml
    privileged: true
    volumes:
      - ${ELLA_E2E_OIDC_DIR:-../.build/oidc}:/certs:ro
    ports:
      - "${ELLA_E2E_OIDC_PORT:-15444}:5002"
    networks:
      default:
      n3:
        driver_opts:
          com.docker.network.endpoint.ifname: n3
      n6:
        driver_opts:
          com.docker.network.endpoint.ifname: n6

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: https://keycloak:${KEYCLOAK_E2E_PORT:-18444}
      KC_HTTPS_PORT: ${KEYCLOAK_E2E_PORT:-18444}
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak-key.pem
      KC_HTTP_ENABLED: "false"
    volumes:
      - ${ELLA_E2E_OIDC_DIR:-../.build/oidc}:/certs:ro
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "${KEYCLOAK_E2E_PORT:-18444}:${KEYCLOAK_E2E_PORT:-18444}"

networks:
  n3:
    internal: true
  n6:

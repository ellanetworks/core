openapi: "3.1.0"
info:
  title: Ella Core API
  description: |
    Ella Core REST API.

    ## Authentication

    `Authorization: Bearer <token>`, where the token is a JWT or an API token (prefix `ellacore_`).

    ## Response Envelope

    - Success: `{"result": <payload>}`
    - Error: `{"error": "message"}`

    ## Pagination

    List endpoints accept `page` (default 1) and `per_page` (default 25, max 100).
    Responses include `items`, `page`, `per_page`, and `total_count`.
  version: "1.0.0"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: localhost:5000

security:
  - BearerAuth: []

tags:
  - name: Status
    description: System health and version information (unauthenticated).
  - name: Metrics
    description: Prometheus metrics endpoint (unauthenticated).
  - name: Profiling
    description: Runtime profiling (pprof).
  - name: Initialization
    description: First-time setup (unauthenticated).
  - name: Authentication
    description: Login, token refresh, logout, and token validation.
  - name: Users
    description: Manage user accounts and API tokens.
  - name: Subscribers
    description: Manage subscribers.
  - name: Subscriber Usage
    description: Subscriber data usage.
  - name: Profiles
    description: Manage subscriber profiles.
  - name: Slices
    description: Manage network slices (S-NSSAI).
  - name: Policies
    description: Manage QoS policies.
  - name: Operator
    description: Operator configuration.
  - name: Data Networks
    description: Manage data networks (DNNs/APNs).
  - name: Routes
    description: Manage static routes.
  - name: NAT
    description: NAT settings.
  - name: Flow Accounting
    description: Flow accounting settings.
  - name: Interfaces
    description: Network interface settings.
  - name: Radios
    description: Radio base stations.
  - name: Radio Events
    description: NGAP and S1AP events.
  - name: Flow Reports
    description: Per-flow traffic reports.
  - name: Audit Logs
    description: Audit logs.
  - name: Cluster
    description: High-availability cluster management.
  - name: Backup & Restore
    description: Database backup and restore.
  - name: Support Bundle
    description: Diagnostic support bundle.
  - name: Location
    description: "Beta: Subscriber location."
  - name: Positioning Sessions
    description: "Beta: Deferred positioning sessions."
  - name: Cell Positions
    description: "Beta: Cell antenna positions."

paths:
  # -- Status --------------------------------------------------------------
  /api/v1/status:
    get:
      operationId: getStatus
      tags: [Status]
      summary: Get system status
      description: Returns the version, revision, initialization, and cluster status.
      security: []
      responses:
        "200":
          description: System status.
          headers:
            X-Ella-Role:
              description: Raft role of the responding node. Only present when clustering is enabled.
              required: false
              schema:
                type: string
                enum: [Leader, Follower, Candidate, Shutdown, Unknown]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponseEnvelope"

  # -- Metrics -------------------------------------------------------------
  /api/v1/metrics:
    get:
      operationId: getMetrics
      tags: [Metrics]
      summary: Get Prometheus metrics
      description: Returns all application metrics in Prometheus text exposition format.
      security: []
      responses:
        "200":
          description: Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string

  # -- Profiling (Pprof) ---------------------------------------------------
  /api/v1/pprof/:
    get:
      operationId: getPprofIndex
      tags: [Profiling]
      summary: Get pprof index
      description: Returns the pprof HTML index.
      responses:
        "200":
          description: Pprof index page.
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/cmdline:
    get:
      operationId: getPprofCmdline
      tags: [Profiling]
      summary: Get process command line
      description: Returns the command-line invocation of the running process.
      responses:
        "200":
          description: Process command line.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/profile:
    get:
      operationId: getPprofCPUProfile
      tags: [Profiling]
      summary: Capture CPU profile
      description: Captures a CPU profile for the given duration.
      parameters:
        - name: seconds
          in: query
          schema:
            type: integer
            minimum: 1
          description: Capture duration in seconds.
      responses:
        "200":
          description: CPU profile data.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/symbol:
    get:
      operationId: getPprofSymbol
      tags: [Profiling]
      summary: Resolve program counters
      description: Resolves program counters to function names.
      responses:
        "200":
          description: Symbol resolution output.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: postPprofSymbol
      tags: [Profiling]
      summary: Resolve posted program counters
      description: Resolves posted program counters to function names.
      requestBody:
        required: false
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Symbol resolution output.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/trace:
    get:
      operationId: getPprofTrace
      tags: [Profiling]
      summary: Capture execution trace
      description: Captures an execution trace for the given duration.
      parameters:
        - name: seconds
          in: query
          schema:
            type: integer
            minimum: 1
          description: Capture duration in seconds.
      responses:
        "200":
          description: Trace data.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/allocs:
    get:
      operationId: getPprofAllocs
      tags: [Profiling]
      summary: Get allocation profile
      description: Returns the allocation profile.
      parameters:
        - name: debug
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: Set to 1 for human-readable output.
      responses:
        "200":
          description: Allocation profile data.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/goroutine:
    get:
      operationId: getPprofGoroutine
      tags: [Profiling]
      summary: Get goroutine profile
      description: Returns the goroutine stack profile.
      parameters:
        - name: debug
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: Set to 1 for human-readable output.
      responses:
        "200":
          description: Goroutine profile data.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/heap:
    get:
      operationId: getPprofHeap
      tags: [Profiling]
      summary: Get heap profile
      description: Returns the heap allocation profile.
      parameters:
        - name: debug
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: Set to 1 for human-readable output.
        - name: gc
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: Set to 1 to run GC first.
      responses:
        "200":
          description: Heap profile data.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/threadcreate:
    get:
      operationId: getPprofThreadcreate
      tags: [Profiling]
      summary: Get thread creation profile
      description: Returns the thread creation profile.
      parameters:
        - name: debug
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: Set to 1 for human-readable output.
      responses:
        "200":
          description: Thread creation profile data.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # -- Initialization ------------------------------------------------------
  /api/v1/init:
    post:
      operationId: initialize
      tags: [Initialization]
      summary: Initialize the system
      description: Creates the first admin user. Only available when no users exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeParams"
      responses:
        "201":
          description: System initialized, first admin user created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializeResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: API not ready.

  # -- Authentication ------------------------------------------------------
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Log in
      description: Returns a JWT and sets a session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginParams"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Authentication]
      summary: Refresh JWT
      description: Issues a new JWT from the session cookie.
      security: []
      responses:
        "200":
          description: New JWT issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Log out
      description: Deletes the session and clears the session cookie.
      security: []
      responses:
        "204":
          description: Logged out.

  /api/v1/auth/lookup-token:
    post:
      operationId: lookupToken
      tags: [Authentication]
      summary: Validate a token
      description: Checks whether the Bearer token is valid.
      responses:
        "200":
          description: Token validity result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupTokenResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/rotate-secret:
    post:
      operationId: rotateSecret
      tags: [Authentication]
      summary: Rotate the JWT secret
      description: Rotates the JWT signing secret, invalidating all JWTs.
      responses:
        "200":
          description: Secret rotated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateSecretResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # -- Users ---------------------------------------------------------------
  /api/v1/users/me:
    get:
      operationId: getLoggedInUser
      tags: [Users]
      summary: Get current user
      description: Returns the current user.
      responses:
        "200":
          description: Current user info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me/password:
    put:
      operationId: updateMyPassword
      tags: [Users]
      summary: Update own password
      description: Changes the current user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyPasswordParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me/api-tokens:
    get:
      operationId: listMyAPITokens
      tags: [Users]
      summary: List my API tokens
      description: Lists the current user's API tokens.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of API tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPITokensResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createMyAPIToken
      tags: [Users]
      summary: Create an API token
      description: Creates an API token for the current user. The token is returned only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenParams"
      responses:
        "201":
          description: Token created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPITokenResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/users/me/api-tokens/{id}:
    delete:
      operationId: deleteMyAPIToken
      tags: [Users]
      summary: Delete an API token
      description: Deletes one of the current user's API tokens.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Token ID.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      description: Lists users.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createUser
      tags: [Users]
      summary: Create a user
      description: Creates a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserParams"
      responses:
        "201":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/users/{email}:
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a user
      description: Returns a user.
      parameters:
        - $ref: "#/components/parameters/EmailPath"
      responses:
        "200":
          description: User details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateUser
      tags: [Users]
      summary: Update a user's role
      description: Changes a user's role.
      parameters:
        - $ref: "#/components/parameters/EmailPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a user
      description: Deletes a user and their API tokens.
      parameters:
        - $ref: "#/components/parameters/EmailPath"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{email}/password:
    put:
      operationId: updateUserPassword
      tags: [Users]
      summary: Update a user's password (admin)
      description: Sets a user's password.
      parameters:
        - $ref: "#/components/parameters/EmailPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{email}/api-tokens:
    get:
      operationId: listUserAPITokens
      tags: [Users]
      summary: List a user's API tokens (admin)
      description: Lists a user's API tokens.
      parameters:
        - $ref: "#/components/parameters/EmailPath"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of API tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPITokensResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createUserAPIToken
      tags: [Users]
      summary: Create an API token for a user (admin)
      description: Creates an API token for a user. The token is returned only once.
      parameters:
        - $ref: "#/components/parameters/EmailPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenParams"
      responses:
        "201":
          description: Token created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPITokenResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/users/{email}/api-tokens/{id}:
    delete:
      operationId: deleteUserAPIToken
      tags: [Users]
      summary: Delete a user's API token (admin)
      description: Deletes one of a user's API tokens.
      parameters:
        - $ref: "#/components/parameters/EmailPath"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Token ID.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -- Subscribers ---------------------------------------------------------
  /api/v1/subscribers:
    get:
      operationId: listSubscribers
      tags: [Subscribers]
      summary: List subscribers
      description: Lists subscribers, ordered by IMSI.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: radio
          in: query
          schema:
            type: string
          description: Filter by last-seen radio.
        - name: data_network
          in: query
          schema:
            type: string
          description: Filter by data network reachable through the subscriber's profile.
        - name: search
          in: query
          schema:
            type: string
            maxLength: 254
          description: Substring match on IMSI or description, ASCII case-insensitive.
      responses:
        "200":
          description: Paginated list of subscribers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSubscribersResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSubscriber
      tags: [Subscribers]
      summary: Provision a subscriber
      description: Provisions a subscriber.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriberParams"
      responses:
        "201":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/subscribers/{imsi}:
    get:
      operationId: getSubscriber
      tags: [Subscribers]
      summary: Get subscriber details
      description: Returns a subscriber with its registrations and sessions.
      parameters:
        - $ref: "#/components/parameters/ImsiPath"
      responses:
        "200":
          description: Subscriber details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriberDetailResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSubscriber
      tags: [Subscribers]
      summary: Update a subscriber
      description: Updates a subscriber.
      parameters:
        - $ref: "#/components/parameters/ImsiPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriberParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSubscriber
      tags: [Subscribers]
      summary: Delete a subscriber
      description: Deletes a subscriber.
      parameters:
        - $ref: "#/components/parameters/ImsiPath"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/subscribers/{imsi}/credentials:
    get:
      operationId: getSubscriberCredentials
      tags: [Subscribers]
      summary: Get subscriber credentials
      description: Returns a subscriber's K, OPc, and sequence number.
      parameters:
        - $ref: "#/components/parameters/ImsiPath"
      responses:
        "200":
          description: Subscriber credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriberCredentialsResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # -- Subscriber Usage ----------------------------------------------------
  /api/v1/subscriber-usage:
    get:
      operationId: getSubscriberUsage
      tags: [Subscriber Usage]
      summary: Get subscriber usage data
      description: Returns subscriber data usage, grouped by day or subscriber.
      parameters:
        - name: group_by
          in: query
          required: true
          schema:
            type: string
            enum: [day, subscriber]
          description: Grouping.
        - name: start
          in: query
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound (RFC 3339). Defaults to 7 days ago.
        - name: end
          in: query
          schema:
            type: string
            format: date-time
          description: Exclusive upper bound (RFC 3339). Defaults to now.
        - name: subscriber
          in: query
          schema:
            type: string
          description: Filter by IMSI.
      responses:
        "200":
          description: Usage data grouped by the requested dimension.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriberUsageResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":

  /api/v1/restore:
    post:
      operationId: restoreBackup
      tags: [Backup & Restore]
      summary: Restore from backup (standalone only)
      description: |
        Restores the Ella Core database from an uploaded archive.
        Only available in standalone deployments.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup:
                  type: string
                  format: binary
                  description: The database backup archive.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Online restore is disabled in HA mode. Use the offline `restore.bundle` flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -- Support Bundle ------------------------------------------------------
  /api/v1/support-bundle:
    post:
      operationId: createSupportBundle
      tags: [Support Bundle]
      summary: Generate a support bundle
      description: Downloads a diagnostic support bundle.
      responses:
        "200":
          description: Support bundle archive.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

  # -- Cluster -----------------------------------------------------------
  /api/v1/cluster/members:
    get:
      operationId: listClusterMembers
      tags: [Cluster]
      summary: List cluster members
      description: Lists cluster members. Empty when clustering is disabled.
      responses:
        "200":
          description: List of cluster members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClusterMembersResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/cluster/members/{id}:
    delete:
      operationId: removeClusterMember
      tags: [Cluster]
      summary: Remove a cluster member
      description: Removes a node from the cluster. The node must be drained unless `force=true`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Node ID.
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          description: Skip the drain requirement.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "421":
          $ref: "#/components/responses/NotLeader"

  /api/v1/cluster/members/{id}/display-name:
    put:
      operationId: setClusterMemberDisplayName
      tags: [Cluster]
      summary: Set a cluster member's display name
      description: Sets a cluster member's display name.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Node ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 63
                  description: Display name. Empty clears it.
              required: [displayName]
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/cluster/members/{id}/promote:
    post:
      operationId: promoteClusterMember
      tags: [Cluster]
      summary: Promote a nonvoter to voter
      description: Promotes a nonvoter cluster member to voter.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Node ID.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "421":
          $ref: "#/components/responses/NotLeader"

  /api/v1/cluster/autopilot:
    get:
      operationId: getAutopilotState
      tags: [Cluster]
      summary: Get the current autopilot state
      description: Returns the cluster autopilot state.
      responses:
        "200":
          description: Autopilot state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotStateResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Proxy to leader failed.
        "503":
          description: No leader available.

  /api/v1/cluster/health:
    get:
      operationId: getClusterHealth
      tags: [Cluster]
      summary: Get a summary of cluster health
      description: Returns a summary of cluster health.
      responses:
        "200":
          description: Cluster health summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterHealthResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/cluster/members/{id}/drain:
    post:
      operationId: drainClusterMember
      tags: [Cluster]
      summary: Drain a specific cluster member
      description: Drains a cluster member.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Node ID.
      responses:
        "200":
          description: Drain result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Target node unreachable.

  /api/v1/cluster/members/{id}/resume:
    post:
      operationId: resumeClusterMember
      tags: [Cluster]
      summary: Resume a drained cluster member
      description: Resumes a drained cluster member.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Node ID.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Target node unreachable.

  /api/v1/cluster/join:
    post:
      operationId: clusterJoin
      tags: [Cluster]
      summary: Join this node to a cluster
      description: Joins this node to an existing cluster.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterJoinRequest"
      responses:
        "202":
          description: Join started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterJoinStatusEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Not waiting to join, or a join is already running.
    get:
      operationId: getClusterJoinStatus
      tags: [Cluster]
      summary: Read this node's join state
      description: Returns this node's join state.
      security: []
      responses:
        "200":
          description: Current join state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterJoinStatusEnvelope"

  /api/v1/cluster/pki/join-tokens:
    post:
      operationId: mintClusterJoinToken
      tags: [Cluster]
      summary: Mint a cluster join token
      description: Mints a single-use cluster join token. Must be sent to the leader.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintJoinTokenRequest"
      responses:
        "201":
          description: Token minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintJoinTokenResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: PKI issuer not available.

  # -- Location (beta) -----------------------------------------------------
  /api/beta/location:
    post:
      operationId: getSubscriberLocation
      tags: [Location]
      summary: Locate a subscriber
      description: "Beta: Locates a subscriber, or creates or cancels a deferred positioning session."
      parameters:
        - name: verbose
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include `supplementaryMeasurements`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationRequest"
      responses:
        "200":
          description: Location estimate (immediate requests).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationDataResponseEnvelope"
        "201":
          description: Deferred positioning session created (periodic/triggered requests).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositioningSessionCreatedEnvelope"
        "204":
          description: Session cancelled (cancel requests).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -- Positioning Sessions (beta) -----------------------------------------
  /api/beta/positioning/sessions:
    get:
      operationId: listPositioningSessions
      tags: [Positioning Sessions]
      summary: List positioning sessions
      description: "Beta: Returns the positioning sessions for a subscriber."
      parameters:
        - name: supi
          in: query
          required: true
          schema:
            type: string
          description: "SUPI whose sessions to list (e.g. `imsi-001010000000001`)."
      responses:
        "200":
          description: Positioning sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPositioningSessionsResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/beta/positioning/sessions/{id}:
    get:
      operationId: getPositioningSession
      tags: [Positioning Sessions]
      summary: Get a positioning session
      description: "Beta: Returns a positioning session and its last result."
      parameters:
        - $ref: "#/components/parameters/PositioningSessionIdPath"
      responses:
        "200":
          description: Positioning session details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositioningSessionDetailResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: cancelPositioningSession
      tags: [Positioning Sessions]
      summary: Cancel a positioning session
      description: "Beta: Cancels an active positioning session."
      parameters:
        - $ref: "#/components/parameters/PositioningSessionIdPath"
      responses:
        "204":
          description: Session cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -- Cell Positions (beta) -----------------------------------------------
  /api/beta/cell-positions:
    get:
      operationId: listCellPositions
      tags: [Cell Positions]
      summary: List cell positions
      description: "Beta: Lists cell positions."
      responses:
        "200":
          description: Cell positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCellPositionsResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createCellPosition
      tags: [Cell Positions]
      summary: Create a cell position
      description: "Beta: Creates a cell position."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CellPositionRequest"
      responses:
        "201":
          description: Cell position created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCellPositionResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/beta/cell-positions/{id}:
    get:
      operationId: getCellPosition
      tags: [Cell Positions]
      summary: Get a cell position
      description: "Beta: Returns a cell position."
      parameters:
        - $ref: "#/components/parameters/CellPositionIdPath"
      responses:
        "200":
          description: Cell position details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellPositionResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateCellPosition
      tags: [Cell Positions]
      summary: Update a cell position
      description: "Beta: Updates a cell position."
      parameters:
        - $ref: "#/components/parameters/CellPositionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CellPositionRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCellPosition
      tags: [Cell Positions]
      summary: Delete a cell position
      description: "Beta: Deletes a cell position."
      parameters:
        - $ref: "#/components/parameters/CellPositionIdPath"
      responses:
        "204":
          description: Cell position deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "JWT token from login or API token (prefixed `ellacore_`)."

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number.
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
      description: Items per page.
    RadioRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        pattern: "^[^:]+:[^:]+(:[^:]+)?:[^:]+$"
      description: "Radio `ref`, e.g. `gNB:001-01:00002a@24` or `eNB:001-01:MacroeNB-00008`."
    EmailPath:
      name: email
      in: path
      required: true
      schema:
        type: string
        format: email
      description: User email address.
    ImsiPath:
      name: imsi
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{6,15}$"
      description: "IMSI, 6 to 15 digits."
    PolicyNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Policy name.
    ProfileNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Profile name.
    SliceNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Slice name.
    DataNetworkNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Data network name (DNN).
    IPVersionPath:
      name: ip_version
      in: path
      required: true
      schema:
        type: string
        enum: [ipv4, ipv6]
      description: IP family of the reservation.
    RouteIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Route ID.
    PositioningSessionIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Positioning session ID.
    CellPositionIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Cell position ID.

  responses:
    Success:
      description: Operation succeeded.
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                $ref: "#/components/schemas/SuccessResponse"
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists or is in use.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotLeader:
      description: This node is not the cluster leader.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotLeaderResponse"

  schemas:
    # -- Common ----------------------------------------------------------
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    NotLeaderResponse:
      type: object
      properties:
        error:
          type: string
        leaderNodeId:
          type: string
        leaderAddress:
          type: string
        leaderAPIAddress:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    CreateSuccessResponse:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
          format: uuid
          description: UUIDv7 of the created resource.
      required: [message, id]

    RetentionPolicyParams:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          description: Number of days to retain data.

    RetentionPolicy:
      type: object
      properties:
        days:
          type: integer
      required: [days]

    RetentionPolicyResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/RetentionPolicy"

    # -- Status ----------------------------------------------------------
    StatusResponse:
      type: object
      properties:
        version:
          type: string
          description: Software version.
        revision:
          type: string
          description: Git commit hash.
        initialized:
          type: boolean
          description: True if the system has at least one user.
        ready:
          type: boolean
          description: True once startup has completed.
        schemaVersion:
          type: integer
          description: Database schema version this node expects.
        datapathAttachMode:
          type: string
          enum: [xdp-native, tcx, xdp-generic]
          description: Data plane attach mode.
        cluster:
          $ref: "#/components/schemas/ClusterStatus"
      required: [version, revision, initialized, ready, schemaVersion, cluster]

    StatusResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/StatusResponse"

    # -- Initialization --------------------------------------------------
    InitializeParams:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    InitializeResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
          description: JWT.
      required: [message, token]

    InitializeResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/InitializeResponse"

    # -- Authentication --------------------------------------------------
    LoginParams:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
          description: JWT.
      required: [message, token]

    LoginResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/LoginResponse"

    RefreshResponse:
      type: object
      properties:
        token:
          type: string
      required: [token]

    RefreshResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/RefreshResponse"

    LookupTokenResponse:
      type: object
      properties:
        valid:
          type: boolean
      required: [valid]

    LookupTokenResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/LookupTokenResponse"

    RotateSecretResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    RotateSecretResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/RotateSecretResponse"

    # -- Users -----------------------------------------------------------
    User:
      type: object
      properties:
        email:
          type: string
          format: email
        role_id:
          type: integer
          description: "1 = Admin, 2 = ReadOnly, 3 = NetworkManager."
          enum: [1, 2, 3]
      required: [email, role_id]

    UserResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/User"

    ListUsersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListUsersResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListUsersResponse"

    CreateUserParams:
      type: object
      required: [email, password, role_id]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        role_id:
          type: integer
          description: "1 = Admin, 2 = ReadOnly, 3 = NetworkManager."
          enum: [1, 2, 3]

    UpdateUserParams:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: integer
          enum: [1, 2, 3]

    UpdatePasswordParams:
      type: object
      required: [password]
      properties:
        password:
          type: string

    UpdateMyPasswordParams:
      type: object
      required: [current_password, password]
      properties:
        current_password:
          type: string
          description: Current password.
        password:
          type: string
          description: New password.

    APIToken:
      type: object
      properties:
        id:
          type: string
          description: Token ID.
        name:
          type: string
        expires_at:
          type: string
          description: Expiration time (RFC 3339). Empty if none.
      required: [id, name]

    ListAPITokensResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListAPITokensResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListAPITokensResponse"

    CreateAPITokenParams:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          description: Token name.
        expires_at:
          type: string
          format: date-time
          description: Expiration time (RFC 3339).

    CreateAPITokenResponse:
      type: object
      properties:
        token:
          type: string
          description: "API token (prefixed `ellacore_`)."
      required: [token]

    CreateAPITokenResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/CreateAPITokenResponse"

    # -- Subscribers -----------------------------------------------------
    SubscriberStatus:
      type: object
      properties:
        registered:
          type: boolean
          description: Whether the subscriber is registered.
        connection_state:
          type: string
          enum: ["idle", "connected"]
          description: "CM state in 5G, ECM state in 4G. Absent when the core holds no context."
        systems:
          type: array
          items:
            type: string
            enum: ["5G", "4G"]
          description: "Systems holding a context, 5G first. Absent when none."
        num_sessions:
          type: integer
          description: "Active sessions across all systems."
        last_seen_at:
          type: string
          format: date-time
          description: "Last seen time (RFC 3339). Absent when never seen."
        last_seen_radio:
          type: string
          description: "Last serving radio. Absent when never seen."
      required: [registered, num_sessions]

    Subscriber:
      type: object
      properties:
        imsi:
          type: string
          description: "IMSI, 6 to 15 digits."
        profile_name:
          type: string
          description: Name of the assigned profile.
        description:
          type: string
          maxLength: 64
          description: Free-text note. Absent when unset.
        status:
          $ref: "#/components/schemas/SubscriberStatus"
      required: [imsi, profile_name, status]

    ListSubscribersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Subscriber"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListSubscribersResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListSubscribersResponse"

    UEConnection:
      type: object
      description: "UE-associated logical connection IDs for the registration's system."
      properties:
        amf_ue_ngap_id:
          type: integer
          format: int64
          description: "AMF UE NGAP ID (5G). INTEGER (0..2^40-1)."
        ran_ue_ngap_id:
          type: integer
          format: int64
          description: "RAN UE NGAP ID (5G). INTEGER (0..2^32-1)."
        mme_ue_s1ap_id:
          type: integer
          format: int64
          description: "MME UE S1AP ID (4G). INTEGER (0..2^32-1)."
        enb_ue_s1ap_id:
          type: integer
          format: int64
          description: "eNB UE S1AP ID (4G). INTEGER (0..2^24-1)."

    Registration:
      type: object
      description: "Mobility-management context for a subscriber."
      properties:
        system:
          type: string
          enum: ["5G", "4G"]
          description: "System of this registration."
        registered:
          type: boolean
          description: "RM state (5G) or EMM state (4G)."
        connection_state:
          type: ["string", "null"]
          enum: ["idle", "connected", null]
          description: "CM state (5G) or ECM state (4G)."
        radio:
          type: string
          description: "Current or last serving radio. Absent when never seen."
        last_seen_at:
          type: string
          description: "Last activity time (RFC 3339). Absent when never seen."
        imei:
          type: string
          description: "IMEI (15 digits). Absent when unknown."
        ciphering_algorithm:
          type: string
          description: "NAS ciphering algorithm (NEAx or EEAx). Absent when none."
        integrity_algorithm:
          type: string
          description: "NAS integrity algorithm (NIAx or EIAx). Absent when none."
        connection:
          oneOf:
            - $ref: "#/components/schemas/UEConnection"
            - type: "null"
          description: "UE-associated logical connection. Null when none."
      required: [system, registered, connection_state, connection]

    SubscriberDetail:
      type: object
      properties:
        imsi:
          type: string
        profile_name:
          type: string
        description:
          type: string
          maxLength: 64
          description: Free-text note. Absent when unset.
        registrations:
          type: array
          description: "Mobility-management contexts, 5G first."
          items:
            $ref: "#/components/schemas/Registration"
        sessions:
          type: array
          description: "Active PDU sessions (5G) and PDN connections (4G)."
          items:
            $ref: "#/components/schemas/Session"
      required: [imsi, profile_name, registrations, sessions]

    SubscriberCredentials:
      type: object
      properties:
        key:
          type: string
          description: "32-character hex permanent key (K)."
        opc:
          type: string
          description: "32-character hex OPc value."
        sequenceNumber:
          type: string
          description: "Sequence number (6-byte hex)."
      required: [key, opc, sequenceNumber]

    SubscriberCredentialsResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/SubscriberCredentials"

    SubscriberDetailResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/SubscriberDetail"

    SNSSAI:
      type: object
      description: "S-NSSAI. Absent for 4G sessions."
      properties:
        sst:
          type: integer
          description: "Slice/Service Type (SST)."
        sd:
          type: string
          description: "Slice Differentiator (SD). Omitted when not set."
      required: [sst]

    Session:
      type: object
      description: "5G PDU session or 4G PDN connection."
      properties:
        system:
          type: string
          enum: ["5G", "4G"]
          description: "The system holding this session."
        id:
          type: integer
          description: "PDU Session ID (5G) or linked EPS Bearer ID (4G)."
        status:
          type: string
          description: "Session status (e.g. active, inactive)."
        ip_type:
          type: string
          enum: ["IPv4", "IPv6", "IPv4v6"]
          description: "Negotiated IP type (5G PDU Session Type / 4G PDN Type)."
        ipv4_address:
          type: string
          description: "Assigned IPv4 address. Omitted if unknown."
        ipv6_prefix:
          type: string
          description: "Assigned IPv6 prefix (/64). Omitted if unknown."
        data_network:
          type: string
          description: "Data network name (DNN in 5G / APN in 4G)."
        slice:
          $ref: "#/components/schemas/SNSSAI"
        ambr_uplink:
          type: string
          description: "Effective uplink session AMBR (e.g. \"100 Mbps\")."
        ambr_downlink:
          type: string
          description: "Effective downlink session AMBR (e.g. \"200 Mbps\")."
      required: [system, id, status]

    CreateSubscriberParams:
      type: object
      required: [imsi, key, sequenceNumber, profile_name]
      properties:
        imsi:
          type: string
          pattern: "^[0-9]{6,15}$"
          description: "IMSI, 6 to 15 digits, starting with the operator MCC and MNC."
        key:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
          description: "32-character hex permanent key (K)."
        opc:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
          description: "32-character hex OPc. Derived from the operator code if omitted."
        sequenceNumber:
          type: string
          description: "6-byte hex sequence number."
        profile_name:
          type: string
          description: Name of an existing profile.
        description:
          type: string
          maxLength: 64
          description: "Free-text note."

    UpdateSubscriberParams:
      type: object
      required: [profile_name]
      properties:
        profile_name:
          type: string
          description: Name of an existing profile.
        description:
          type: string
          maxLength: 64
          description: "Free-text note. Omitting it clears the value."

    # -- Subscriber Usage ------------------------------------------------
    DailySubscriberUsage:
      type: object
      properties:
        date:
          type: string
          format: date
          description: UTC day, YYYY-MM-DD.
        uplink_bytes:
          type: integer
          format: int64
        downlink_bytes:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
      required: [date, uplink_bytes, downlink_bytes, total_bytes]

    PerSubscriberUsage:
      type: object
      properties:
        imsi:
          type: string
        uplink_bytes:
          type: integer
          format: int64
        downlink_bytes:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
      required: [imsi, uplink_bytes, downlink_bytes, total_bytes]

    SubscriberUsageResponseEnvelope:
      type: object
      properties:
        result:
          type: array
          description: "`DailySubscriberUsage` (oldest first) for group_by=day; `PerSubscriberUsage` (by total bytes, descending) for group_by=subscriber."
          items:
            oneOf:
              - $ref: "#/components/schemas/DailySubscriberUsage"
              - $ref: "#/components/schemas/PerSubscriberUsage"

    # -- Policies --------------------------------------------------------
    PolicyRule:
      type: object
      properties:
        description:
          type: string
        remote_prefix:
          type: ["string", "null"]
          description: "CIDR notation (e.g. \"10.0.0.0/24\") or null."
        protocol:
          type: integer
          description: "Protocol number (0-255)."
        port_low:
          type: integer
          description: "Low port number (0-65535)."
        port_high:
          type: integer
          description: "High port number (0-65535)."
        action:
          type: string
          enum: [allow, deny]
      required: [description, protocol, port_low, port_high, action]

    PolicyRules:
      type: object
      properties:
        uplink:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"
          description: "Uplink rules, in order."
        downlink:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"
          description: "Downlink rules, in order."

    Policy:
      type: object
      properties:
        name:
          type: string
        profile_name:
          type: string
          description: Profile name.
        slice_name:
          type: string
          description: Slice name.
        session_ambr_uplink:
          type: string
          description: "Session AMBR uplink (e.g. \"100 Mbps\")."
        session_ambr_downlink:
          type: string
          description: "Session AMBR downlink (e.g. \"200 Mbps\")."
        var5qi:
          type: integer
          description: "5G QoS Identifier (non-GBR)."
          enum: [5, 6, 7, 8, 9, 69, 70, 79, 80]
        arp:
          type: integer
          description: "Allocation and Retention Priority."
          minimum: 1
          maximum: 15
        data_network_name:
          type: string
          description: Data network name.
        rules:
          $ref: "#/components/schemas/PolicyRules"
          description: "Network rules by direction."
        default:
          type: boolean
          description: "Whether this is the profile's default DNN/APN."
      required: [name, profile_name, slice_name, session_ambr_uplink, session_ambr_downlink, var5qi, arp, data_network_name]

    PolicyResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/Policy"

    ListPoliciesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Policy"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListPoliciesResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListPoliciesResponse"

    CreatePolicyParams:
      type: object
      required: [name, profile_name, slice_name, data_network_name, session_ambr_uplink, session_ambr_downlink, var5qi, arp]
      properties:
        name:
          type: string
          maxLength: 255
        profile_name:
          type: string
          description: Name of an existing profile.
        slice_name:
          type: string
          description: Name of an existing network slice.
        data_network_name:
          type: string
          description: Name of an existing data network.
        session_ambr_uplink:
          type: string
          description: "e.g. \"100 Mbps\""
        session_ambr_downlink:
          type: string
          description: "e.g. \"200 Mbps\""
        var5qi:
          type: integer
          description: "5G QoS Identifier (non-GBR)."
          enum: [5, 6, 7, 8, 9, 69, 70, 79, 80]
        arp:
          type: integer
          description: "Allocation and Retention Priority."
          minimum: 1
          maximum: 15
        rules:
          $ref: "#/components/schemas/PolicyRules"
          description: "Network rules by direction."
        default:
          type: boolean
          description: "Make this the profile's default DNN/APN. A profile's first policy is always the default."

    UpdatePolicyParams:
      type: object
      required: [profile_name, slice_name, data_network_name, session_ambr_uplink, session_ambr_downlink, var5qi, arp]
      properties:
        profile_name:
          type: string
          description: Name of an existing profile.
        slice_name:
          type: string
          description: Name of an existing network slice.
        data_network_name:
          type: string
          description: Name of an existing data network.
        session_ambr_uplink:
          type: string
          description: "e.g. \"100 Mbps\""
        session_ambr_downlink:
          type: string
          description: "e.g. \"200 Mbps\""
        var5qi:
          type: integer
          description: "5G QoS Identifier (non-GBR)."
          enum: [5, 6, 7, 8, 9, 69, 70, 79, 80]
        arp:
          type: integer
          description: "Allocation and Retention Priority."
          minimum: 1
          maximum: 15
        rules:
          $ref: "#/components/schemas/PolicyRules"
          description: "Replaces all existing rules. Omitting it deletes all rules."
        default:
          type: boolean
          description: "Make this the profile's default DNN/APN. False leaves it unchanged."

    # -- Profiles --------------------------------------------------------
    Profile:
      type: object
      properties:
        name:
          type: string
        ue_ambr_uplink:
          type: string
          description: "UE-AMBR uplink (e.g. \"1 Gbps\")."
        ue_ambr_downlink:
          type: string
          description: "UE-AMBR downlink (e.g. \"1 Gbps\")."
        allow_4g:
          type: boolean
          description: "Allow 4G access. Defaults to true."
        allow_5g:
          type: boolean
          description: "Allow 5G access. Defaults to true."
      required: [name, ue_ambr_uplink, ue_ambr_downlink]

    ProfileResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/Profile"

    ListProfilesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListProfilesResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListProfilesResponse"

    CreateProfileParams:
      type: object
      required: [name, ue_ambr_uplink, ue_ambr_downlink]
      properties:
        name:
          type: string
          maxLength: 255
        ue_ambr_uplink:
          type: string
          description: "e.g. \"1 Gbps\""
        ue_ambr_downlink:
          type: string
          description: "e.g. \"1 Gbps\""
        allow_4g:
          type: boolean
          description: "Allow 4G access. Defaults to true."
        allow_5g:
          type: boolean
          description: "Allow 5G access. Defaults to true."

    UpdateProfileParams:
      type: object
      required: [ue_ambr_uplink, ue_ambr_downlink]
      properties:
        ue_ambr_uplink:
          type: string
          description: "e.g. \"1 Gbps\""
        ue_ambr_downlink:
          type: string
          description: "e.g. \"1 Gbps\""
        allow_4g:
          type: boolean
          description: "Allow 4G access. Unchanged if omitted."
        allow_5g:
          type: boolean
          description: "Allow 5G access. Unchanged if omitted."

    # -- Slices ----------------------------------------------------------
    Slice:
      type: object
      properties:
        name:
          type: string
        sst:
          type: integer
          description: "Slice/Service Type."
          minimum: 0
          maximum: 255
        sd:
          type: string
          description: "Slice Differentiator (hex). Absent when unset."
      required: [name, sst]

    SliceResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/Slice"

    ListSlicesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Slice"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListSlicesResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListSlicesResponse"

    CreateSliceParams:
      type: object
      required: [name, sst]
      properties:
        name:
          type: string
          maxLength: 255
        sst:
          type: integer
          minimum: 0
          maximum: 255
        sd:
          type: string
          maxLength: 6
          description: "Slice Differentiator (hex)."

    UpdateSliceParams:
      type: object
      required: [sst]
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
        sd:
          type: string
          maxLength: 6
          description: "Slice Differentiator (hex)."

    # -- Operator --------------------------------------------------------
    OperatorID:
      type: object
      properties:
        mcc:
          type: string
          description: "Mobile Country Code (3 digits)."
        mnc:
          type: string
          description: "Mobile Network Code (2-3 digits)."
      required: [mcc, mnc]

    OperatorTracking:
      type: object
      properties:
        supportedTacs:
          type: array
          items:
            type: string
          description: "List of 6-character hex Tracking Area Codes."
      required: [supportedTacs]

    OperatorResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/OperatorID"
        tracking:
          $ref: "#/components/schemas/OperatorTracking"
        homeNetworkKeys:
          type: array
          items:
            $ref: "#/components/schemas/HomeNetworkKeyResponse"
        nasSecurity:
          $ref: "#/components/schemas/OperatorNASSecurity"
        spn:
          $ref: "#/components/schemas/OperatorSPN"

    OperatorResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/OperatorResponse"

    OperatorTrackingResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/OperatorTracking"

    OperatorIDResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/OperatorID"

    UpdateOperatorTrackingParams:
      type: object
      required: [supportedTacs]
      properties:
        supportedTacs:
          type: array
          maxItems: 12
          items:
            type: string
            pattern: "^[0-9a-fA-F]{6}$"

    UpdateOperatorIDParams:
      type: object
      required: [mcc, mnc]
      properties:
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
          description: "3-digit Mobile Country Code."
        mnc:
          type: string
          pattern: "^[0-9]{2,3}$"
          description: "2 or 3-digit Mobile Network Code."

    UpdateOperatorCodeParams:
      type: object
      required: [operatorCode]
      properties:
        operatorCode:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
          description: "32-character hex operator code (OP)."

    HomeNetworkKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Key ID.
        keyIdentifier:
          type: integer
          minimum: 0
          maximum: 255
          description: Home Network Public Key Identifier.
        scheme:
          type: string
          enum: [A, B]
          description: "`A` (X25519) or `B` (P-256)."
        publicKey:
          type: string
          description: Public key (hex).

    CreateHomeNetworkKeyParams:
      type: object
      required: [keyIdentifier, scheme, privateKey]
      properties:
        keyIdentifier:
          type: integer
          minimum: 0
          maximum: 255
        scheme:
          type: string
          enum: [A, B]
        privateKey:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
          description: "64-character hex private key."

    HomeNetworkKeyPrivateKeyResponse:
      type: object
      properties:
        privateKey:
          type: string
          description: "64-character hex private key."

    UpdateOperatorNASSecurityParams:
      type: object
      required: [ciphering, integrity]
      properties:
        ciphering:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [NULL, SNOW3G, AES]
          description: "Ciphering algorithms, in preference order."
        integrity:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [NULL, SNOW3G, AES]
          description: "Integrity algorithms, in preference order."

    OperatorNASSecurity:
      type: object
      properties:
        ciphering:
          type: array
          items:
            type: string
            enum: [NULL, SNOW3G, AES]
          description: "Ciphering algorithms, in preference order."
        integrity:
          type: array
          items:
            type: string
            enum: [NULL, SNOW3G, AES]
          description: "Integrity algorithms, in preference order."

    OperatorSPN:
      type: object
      properties:
        fullName:
          type: string
          description: "Full network name."
        shortName:
          type: string
          description: "Short network name."

    UpdateOperatorSPNParams:
      type: object
      required: [fullName, shortName]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 50
          description: "Full network name (printable ASCII)."
        shortName:
          type: string
          minLength: 1
          maxLength: 50
          description: "Short network name (printable ASCII)."

    # -- Data Networks ---------------------------------------------------
    DataNetworkStatus:
      type: object
      properties:
        sessions:
          type: integer
          description: Active sessions.
      required: [sessions]

    DataNetworkIPAllocation:
      type: object
      properties:
        pool_size:
          type: integer
          description: Usable addresses in the pool.
        allocated:
          type: integer
          description: Allocated addresses.
        available:
          type: integer
          description: Available addresses.
      required: [pool_size, allocated, available]

    DataNetwork:
      type: object
      properties:
        name:
          type: string
        ipv4_pool:
          type: string
          description: "IPv4 pool in CIDR notation."
        ipv6_pool:
          type: string
          description: "IPv6 pool in CIDR notation."
        dns:
          type: string
          description: DNS server IP address.
        mtu:
          type: integer
          description: "MTU."
        status:
          $ref: "#/components/schemas/DataNetworkStatus"
        ip_allocation:
          $ref: "#/components/schemas/DataNetworkIPAllocation"
          description: IPv4 pool usage. Detail response only.
        ipv6_allocation:
          $ref: "#/components/schemas/DataNetworkIPAllocation"
          description: IPv6 pool usage. Detail response only.
      required: [name, ipv4_pool, dns, mtu, status]

    DataNetworkResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/DataNetwork"

    ListDataNetworksResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DataNetwork"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListDataNetworksResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListDataNetworksResponse"

    CreateDataNetworkParams:
      type: object
      required: [name, ipv4_pool, dns, mtu]
      properties:
        name:
          type: string
          description: "DNN (lowercase alphanumeric, hyphens, dots)."
        ipv4_pool:
          type: string
          description: "IPv4 CIDR notation (e.g. \"10.0.0.0/24\")."
        ipv6_pool:
          type: string
          description: "IPv6 CIDR notation (e.g. \"2001:db8::/48\")."
        dns:
          type: string
          description: DNS server IP address.
        mtu:
          type: integer
          minimum: 0
          maximum: 65535

    UpdateDataNetworkParams:
      type: object
      required: [ipv4_pool, dns, mtu]
      properties:
        ipv4_pool:
          type: string
          description: "IPv4 CIDR notation (e.g. \"10.0.0.0/24\")."
        ipv6_pool:
          type: string
          description: "IPv6 CIDR notation (e.g. \"2001:db8::/48\")."
        dns:
          type: string
          description: DNS server IP address.
        mtu:
          type: integer
          minimum: 0
          maximum: 65535

    IPAllocationItem:
      type: object
      properties:
        address:
          type: string
          description: "Allocated IPv4 address (e.g. \"10.45.0.3\") or IPv6 /64 prefix (e.g. \"2001:db8::/64\")."
        imsi:
          type: string
          description: Subscriber IMSI.
        type:
          type: string
          description: "Lease type (e.g. \"dynamic\")."
        session_id:
          type: ["integer", "null"]
          description: Session ID. Null when not in use.
      required: [address, imsi, type, session_id]

    ListIPAllocationsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IPAllocationItem"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListIPAllocationsResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListIPAllocationsResponse"

    StaticIP:
      type: object
      properties:
        imsi:
          type: string
          description: Subscriber IMSI.
        data_network:
          type: string
          description: Data network name (DNN).
        ip_version:
          type: string
          enum: [ipv4, ipv6]
        address:
          type: string
          description: "Pinned IPv4 address or IPv6 /64 prefix."
        status:
          type: string
          enum: [reserved, active]
          description: "`active` when bound to a session."
        session_id:
          type: ["integer", "null"]
          description: Session ID. Null when reserved.
      required: [imsi, data_network, ip_version, address, status, session_id]

    StaticIPList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StaticIP"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    StaticIPListResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/StaticIPList"

    CreateStaticIPParams:
      type: object
      required: [imsi, address]
      properties:
        imsi:
          type: string
          description: "IMSI, 6 to 15 digits."
        address:
          type: string
          description: "IPv4 address or /64 IPv6 prefix in the data network pool."

    UpdateStaticIPParams:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: "IPv4 address or /64 IPv6 prefix in the data network pool."

    FramedRoute:
      type: object
      properties:
        imsi:
          type: string
          description: Subscriber IMSI.
        ipv4:
          type: array
          items:
            type: string
          description: IPv4 framed-route prefixes (CIDR).
        ipv6:
          type: array
          items:
            type: string
          description: IPv6 framed-route prefixes (CIDR).
      required: [imsi]

    FramedRouteList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FramedRoute"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    FramedRouteListResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/FramedRouteList"

    CreateFramedRouteParams:
      type: object
      required: [imsi]
      properties:
        imsi:
          type: string
          description: "IMSI, 6 to 15 digits."
        ipv4:
          type: array
          items:
            type: string
          description: "IPv4 prefixes (CIDR), at most 8."
        ipv6:
          type: array
          items:
            type: string
          description: "IPv6 prefixes (CIDR), at most 8."

    UpdateFramedRouteParams:
      type: object
      properties:
        ipv4:
          type: array
          items:
            type: string
          description: "IPv4 prefixes (CIDR). Empty clears them."
        ipv6:
          type: array
          items:
            type: string
          description: "IPv6 prefixes (CIDR). Empty clears them."

    # -- Routes ----------------------------------------------------------
    Route:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Route ID. 0 for BGP-learned routes.
        destination:
          type: string
          description: "Destination in CIDR notation."
        gateway:
          type: string
          description: Gateway IPv4 or IPv6 address.
        interface:
          type: string
          enum: [n3, n6]
        metric:
          type: integer
        source:
          type: string
          enum: [static, bgp]
      required: [id, destination, gateway, interface, metric, source]

    RouteResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/Route"

    ListRoutesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListRoutesResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListRoutesResponse"

    CreateRouteParams:
      type: object
      required: [destination, gateway, interface, metric]
      properties:
        destination:
          type: string
          description: "Destination in CIDR notation."
        gateway:
          type: string
          description: Gateway IPv4 or IPv6 address.
        interface:
          type: string
          enum: [n3, n6]
        metric:
          type: integer
          minimum: 0

    CreateRouteResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/CreateSuccessResponse"

    # -- NAT -------------------------------------------------------------
    NATInfo:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]

    NATInfoResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/NATInfo"

    UpdateNATInfoParams:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    # -- BGP --------------------------------------------------------------
    BGPSettings:
      type: object
      properties:
        enabled:
          type: boolean
        localAS:
          type: integer
        routerID:
          type: string
        listenAddress:
          type: string
        rejectedPrefixes:
          type: array
          description: Read-only prefixes rejected from BGP peers.
          items:
            $ref: "#/components/schemas/RejectedPrefix"
      required: [enabled, localAS, routerID, listenAddress, rejectedPrefixes]

    BGPSettingsResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/BGPSettings"

    UpdateBGPSettingsParams:
      type: object
      required: [enabled, localAS, routerID, listenAddress]
      properties:
        enabled:
          type: boolean
        localAS:
          type: integer
        routerID:
          type: string
        listenAddress:
          type: string

    BGPImportPrefix:
      type: object
      properties:
        prefix:
          type: string
          description: CIDR prefix.
        maxLength:
          type: integer
          description: Maximum accepted prefix length.
      required: [prefix, maxLength]

    BGPPeer:
      type: object
      properties:
        id:
          type: integer
        address:
          type: string
        remoteAS:
          type: integer
        holdTime:
          type: integer
        hasPassword:
          type: boolean
          description: Whether an MD5 password is set.
        description:
          type: string
        importPrefixes:
          type: array
          items:
            $ref: "#/components/schemas/BGPImportPrefix"
          description: Accepted prefixes. Empty accepts nothing.
        state:
          type: string
          description: Session state. Empty when BGP is disabled.
        uptime:
          type: string
          description: Session uptime. Present when established.
        prefixesSent:
          type: integer
          description: Prefixes sent.
        prefixesReceived:
          type: integer
          description: Prefixes received.
        prefixesAccepted:
          type: integer
          description: Prefixes accepted.
      required: [id, address, remoteAS, holdTime, hasPassword, description, importPrefixes]

    BGPPeerResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/BGPPeer"

    ListBGPPeersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BGPPeer"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListBGPPeersResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListBGPPeersResponse"

    CreateBGPPeerParams:
      type: object
      required: [address, remoteAS]
      properties:
        address:
          type: string
          description: Peer IP address.
        remoteAS:
          type: integer
          description: Remote AS number.
        holdTime:
          type: integer
          default: 90
          minimum: 3
          maximum: 65535
          description: Hold time in seconds.
        password:
          type: string
          description: MD5 password.
        description:
          type: string
        importPrefixes:
          type: array
          items:
            $ref: "#/components/schemas/BGPImportPrefix"
          description: Accepted prefixes.

    UpdateBGPPeerParams:
      type: object
      required: [address, remoteAS]
      properties:
        address:
          type: string
          description: Peer IP address.
        remoteAS:
          type: integer
          description: Remote AS number.
        holdTime:
          type: integer
          default: 90
          minimum: 3
          maximum: 65535
          description: Hold time in seconds.
        password:
          type: string
          description: MD5 password.
        description:
          type: string
        importPrefixes:
          type: array
          items:
            $ref: "#/components/schemas/BGPImportPrefix"
          description: Accepted prefixes.

    BGPRoute:
      type: object
      properties:
        subscriber:
          type: string
        prefix:
          type: string
        nextHop:
          type: string
      required: [subscriber, prefix, nextHop]

    BGPAdvertisedRoutesResponse:
      type: object
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/BGPRoute"
      required: [routes]

    BGPAdvertisedRoutesResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/BGPAdvertisedRoutesResponse"

    BGPLearnedRoute:
      type: object
      properties:
        prefix:
          type: string
        nextHop:
          type: string
        peer:
          type: string
          description: Advertising peer address.
      required: [prefix, nextHop, peer]

    BGPLearnedRoutesResponse:
      type: object
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/BGPLearnedRoute"
      required: [routes]

    BGPLearnedRoutesResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/BGPLearnedRoutesResponse"

    RejectedPrefix:
      type: object
      properties:
        prefix:
          type: string
          description: Rejected prefix (CIDR).
        source:
          type: string
          enum: [builtin, data_network, interface]
          description: Origin of the filter.
        description:
          type: string
          description: Reason for the filter.
      required: [prefix, source, description]

    # -- Flow Accounting -------------------------------------------------
    FlowAccountingInfo:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]

    FlowAccountingInfoResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/FlowAccountingInfo"

    UpdateFlowAccountingInfoParams:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    # -- Local Switch ----------------------------------------------------
    LocalSwitchInfo:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]

    LocalSwitchInfoResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/LocalSwitchInfo"

    UpdateLocalSwitchInfoParams:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    # -- Interfaces ------------------------------------------------------
    Vlan:
      type: object
      properties:
        master_interface:
          type: string
        vlan_id:
          type: integer

    N2Interface:
      type: object
      properties:
        addresses:
          type: array
          items:
            type: string
        port:
          type: integer
        interface:
          type: string
      required: [addresses, port]

    N3Interface:
      type: object
      properties:
        name:
          type: string
        addresses:
          type: array
          items:
            type: string
        external_address:
          type: string
        vlan:
          $ref: "#/components/schemas/Vlan"
      required: [name, addresses, external_address]

    N6Interface:
      type: object
      properties:
        name:
          type: string
        addresses:
          type: array
          items:
            type: string
        vlan:
          $ref: "#/components/schemas/Vlan"
      required: [name, addresses]

    APIInterface:
      type: object
      properties:
        addresses:
          type: array
          items:
            type: string
        port:
          type: integer
      required: [addresses, port]

    NetworkInterfaces:
      type: object
      properties:
        n2:
          $ref: "#/components/schemas/N2Interface"
        n3:
          $ref: "#/components/schemas/N3Interface"
        n6:
          $ref: "#/components/schemas/N6Interface"
        api:
          $ref: "#/components/schemas/APIInterface"

    NetworkInterfacesResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/NetworkInterfaces"

    UpdateN3SettingsParams:
      type: object
      properties:
        external_address:
          type: string
          description: "IPv4 address, IPv6 address, or one of each comma-separated. Empty uses the default."

    # -- Radios ----------------------------------------------------------
    PlmnID:
      type: object
      properties:
        mcc:
          type: string
        mnc:
          type: string
      required: [mcc, mnc]

    Tai:
      type: object
      properties:
        plmnID:
          $ref: "#/components/schemas/PlmnID"
        tac:
          type: string
      required: [plmnID, tac]

    Snssai:
      type: object
      properties:
        sst:
          type: integer
        sd:
          type: string

    SupportedTAI:
      type: object
      properties:
        tai:
          $ref: "#/components/schemas/Tai"
        snssais:
          type: array
          items:
            $ref: "#/components/schemas/Snssai"

    Radio:
      type: object
      properties:
        name:
          type: string
        ref:
          type: string
          description: Radio identity. Empty before setup completes.
        id:
          type: string
          description: Global RAN Node ID, without the PLMN.
        plmn:
          $ref: "#/components/schemas/PlmnID"
        bit_length:
          type: integer
          minimum: 22
          maximum: 32
          description: Bit length of the gNB ID. Present on gNBs only.
        address:
          type: string
          description: SCTP remote address (IP:port).
        type:
          type: string
          enum: [gNB, ng-eNB, eNB, N3IWF, Unknown]
          description: RAN node type.
        status:
          type: string
          enum: [online, offline]
          description: Whether the radio is associated with this node.
        connected_at:
          type: string
          format: date-time
          description: Association time (RFC 3339).
        last_seen_at:
          type: string
          format: date-time
          description: Last message time (RFC 3339).
        disconnected_at:
          type: string
          format: date-time
          description: Disconnection time (RFC 3339). Empty while online.
      required: [name, ref, id, address, type, status, connected_at, last_seen_at, disconnected_at]

    RadioDetail:
      type: object
      properties:
        name:
          type: string
        ref:
          type: string
          description: Radio identity. Empty before setup completes.
        id:
          type: string
          description: Global RAN Node ID, without the PLMN.
        plmn:
          $ref: "#/components/schemas/PlmnID"
        bit_length:
          type: integer
          minimum: 22
          maximum: 32
          description: Bit length of the gNB ID. Present on gNBs only.
        address:
          type: string
          description: SCTP remote address (IP:port).
        status:
          type: string
          enum: [online, offline]
          description: Whether the radio is associated with this node.
        connected_at:
          type: string
          format: date-time
          description: Association time (RFC 3339).
        last_seen_at:
          type: string
          format: date-time
          description: Last message time (RFC 3339).
        disconnected_at:
          type: string
          format: date-time
          description: Disconnection time (RFC 3339). Empty while online.
        type:
          type: string
          enum: [gNB, ng-eNB, eNB, N3IWF, Unknown]
          description: RAN node type.
        supported_tais:
          type: array
          items:
            $ref: "#/components/schemas/SupportedTAI"
      required: [name, ref, id, address, status, connected_at, last_seen_at, disconnected_at, type, supported_tais]

    RadioResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/RadioDetail"

    ListRadiosResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Radio"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListRadiosResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListRadiosResponse"

    # -- Radio Events ----------------------------------------------------
    RadioEvent:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
        protocol:
          type: string
        message_type:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        radio:
          type: string
          description: Radio name.
        address:
          type: string
          description: Radio address.
        raw:
          type: string
          format: byte
          description: Raw message (base64).
        details:
          type: string
      required: [id, timestamp, protocol, message_type, direction, radio, address]

    ListRadioEventsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RadioEvent"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListRadioEventsResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListRadioEventsResponse"

    RadioEventDetail:
      type: object
      properties:
        raw:
          type: string
          format: byte
          description: Raw NGAP or S1AP message (base64).
        decoded:
          type: object
          description: Decoded NGAP or S1AP message.
          properties:
            pdu_type:
              type: string
              description: "PDU type."
            procedure_code:
              type: object
              description: "NGAP/S1AP procedure code."
              properties:
                type:
                  type: string
                value:
                  type: integer
                label:
                  type: string
                unknown:
                  type: boolean
            summary:
              type: string
              description: "One-line message summary."
            criticality:
              type: object
              description: "Criticality."
              properties:
                type:
                  type: string
                value:
                  type: integer
                label:
                  type: string
                unknown:
                  type: boolean
            value:
              type: object
              description: "Decoded message payload."
              additionalProperties: true
          additionalProperties: true

    RadioEventDetailResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/RadioEventDetail"

    # -- Flow Reports ----------------------------------------------------
    FlowReport:
      type: object
      properties:
        id:
          type: integer
        subscriber_id:
          type: string
          description: Subscriber IMSI.
        source_ip:
          type: string
        destination_ip:
          type: string
        source_port:
          type: integer
        destination_port:
          type: integer
        protocol:
          type: integer
          description: IP protocol number.
        packets:
          type: integer
        bytes:
          type: integer
        start_time:
          type: string
        end_time:
          type: string
        direction:
          type: string
          enum: [uplink, downlink]
        action:
          type: string
          enum: [allow, drop]
          description: Whether the flow was allowed or dropped.
      required: [id, subscriber_id, source_ip, destination_ip, source_port, destination_port, protocol, packets, bytes, start_time, end_time, direction, action]

    ListFlowReportsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FlowReport"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListFlowReportsResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListFlowReportsResponse"

    FlowReportProtocolStat:
      type: object
      properties:
        protocol:
          type: integer
        count:
          type: integer

    FlowReportIPStat:
      type: object
      properties:
        ip:
          type: string
        count:
          type: integer

    FlowReportStats:
      type: object
      properties:
        protocols:
          type: array
          items:
            $ref: "#/components/schemas/FlowReportProtocolStat"
        top_destinations_uplink:
          type: array
          items:
            $ref: "#/components/schemas/FlowReportIPStat"

    FlowReportStatsResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/FlowReportStats"

    # -- Audit Logs ------------------------------------------------------
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
        level:
          type: string
        user:
          type: string
          description: User email.
        action:
          type: string
          description: Action (e.g. `create_subscriber`).
        ip:
          type: string
          description: Client IP address.
        details:
          type: string
      required: [id, timestamp, level, user, action, ip, details]

    ListAuditLogsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer
      required: [items, page, per_page, total_count]

    ListAuditLogsResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ListAuditLogsResponse"

    # -- Cluster ---------------------------------------------------------
    ClusterStatus:
      description: Cluster information.
      oneOf:
        - title: Standalone
          type: object
          properties:
            enabled:
              const: false
            nodeId:
              type: [string, integer]
              description: Identity of this node.
          required: [enabled, nodeId]
          additionalProperties: false
        - title: Clustered
          type: object
          properties:
            enabled:
              const: true
            role:
              type: string
              description: "Raft role."
            nodeId:
              type: [string, integer]
              description: Identity of this node.
            displayName:
              type: string
              description: Operator-set name for this node. Empty when unset.
            isLeader:
              type: boolean
              description: True when this node is the leader.
            leaderNodeId:
              type: [string, integer]
              description: Leader node ID. Empty when unknown.
            appliedIndex:
              type: integer
              format: uint64
              description: Last applied Raft log index.
            clusterId:
              type: string
              description: Cluster ID. Omitted when unset.
            leaderAPIAddress:
              type: string
              description: Leader API URL. Empty when unknown.
            appliedSchemaVersion:
              type: integer
              description: Schema version committed by the cluster.
            pendingMigration:
              $ref: "#/components/schemas/PendingMigration"
          required: [enabled, role, nodeId, isLeader, leaderNodeId, appliedIndex, appliedSchemaVersion]

    PendingMigration:
      type: object
      description: Present while the cluster has not committed this node's schema version.
      properties:
        currentSchema:
          type: integer
          description: Committed schema version.
        targetSchema:
          type: integer
          description: Target schema version.
        laggardNodeId:
          type: [string, integer]
          description: Node blocking the migration. Omitted when none.
        laggardReason:
          type: string
          enum: [schema_behind, no_member_row, capability_unknown, configuration_unavailable]
          description: Why the migration is blocked.
      required: [currentSchema, targetSchema]

    ClusterMember:
      type: object
      properties:
        nodeId:
          type: [string, integer]
          description: Identity of the node.
        displayName:
          type: string
          description: Operator-set name for this node. Empty when unset.
        amfPointer:
          type: integer
          minimum: 1
          maximum: 63
          description: AMF Pointer allocated to this node.
        raftAddress:
          type: string
          description: "Raft address (host:port)."
        apiAddress:
          type: string
          description: "API address (host:port)."
        binaryVersion:
          type: string
          description: Software version.
        suffrage:
          type: string
          enum: [voter, nonvoter]
          description: Raft suffrage.
        isLeader:
          type: boolean
          description: True when this member is the leader.
        drainState:
          type: string
          enum: [active, draining, drained]
          description: Drain state of the member.
        drainUpdatedAt:
          type: string
          format: date-time
          description: Last drainState change (RFC 3339). Empty if never drained.
      required: [nodeId, raftAddress, apiAddress, binaryVersion, suffrage, isLeader, drainState]

    ListClusterMembersResponseEnvelope:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/ClusterMember"

    AutopilotServer:
      type: object
      properties:
        nodeId:
          type: [string, integer]
          description: Identity of the node.
        raftAddress:
          type: string
          description: "Raft address (host:port)."
        nodeStatus:
          type: string
          description: "Autopilot node status (e.g. `alive`, `left`, `failed`)."
        healthy:
          type: boolean
          description: Autopilot health verdict.
        isLeader:
          type: boolean
          description: True when this peer is the leader.
        hasVotingRights:
          type: boolean
          description: True when this peer is a voter.
        stableSince:
          type: string
          format: date-time
          description: Last change of `healthy` (UTC). Omitted when unknown.
      required: [nodeId, raftAddress, nodeStatus, healthy, isLeader, hasVotingRights]

    AutopilotState:
      type: object
      properties:
        healthy:
          type: boolean
          description: True when every voter is healthy.
        failureTolerance:
          type: integer
          description: Voter failures survivable without losing quorum.
        leaderNodeId:
          type: [string, integer]
          description: Leader node ID. Empty when unknown.
        voters:
          type: array
          items:
            type: [string, integer]
          description: Identities of voting members, ascending.
        servers:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotServer"
          description: Per-peer state, sorted by nodeId.
      required: [healthy, failureTolerance, leaderNodeId, voters, servers]

    AutopilotStateResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/AutopilotState"

    ClusterHealth:
      type: object
      properties:
        state:
          type: string
          enum: [healthy, degraded, no_leader, unknown]
        totalVoters:
          type: integer
          description: Voters in the Raft configuration.
        healthyVoters:
          type: integer
          description: Voters reported healthy. Omitted when unknown.
        failureTolerance:
          type: integer
          description: Voter failures survivable without losing quorum. Omitted when unknown.
      required: [state, totalVoters]

    ClusterHealthResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ClusterHealth"

    DrainResponse:
      type: object
      properties:
        drainState:
          type: string
          enum: [draining, drained]
          description: Drain state of the target after the call.
      required: [drainState]

    DrainResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/DrainResponse"

    ClusterJoinRequest:
      type: object
      properties:
        token:
          type: string
          description: "Join token from `POST /api/v1/cluster/pki/join-tokens`."
        seedAddresses:
          type: array
          minItems: 1
          items:
            type: string
          description: "Cluster addresses (`host:port`) of existing members, tried in order."
        suffrage:
          type: string
          enum: [voter, nonvoter]
          description: Defaults to voter.
      required: [token, seedAddresses]

    ClusterJoinStatus:
      type: object
      properties:
        state:
          type: string
          enum: [unavailable, waiting, joining, joined]
        error:
          type: string
          description: Reason the last attempt failed.
      required: [state]

    ClusterJoinStatusEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ClusterJoinStatus"

    MintJoinTokenRequest:
      type: object
      properties:
        ttlSeconds:
          type: integer
          description: Token lifetime in seconds. Defaults to 1800.

    MintJoinTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Join token.
        expiresAt:
          type: integer
          format: int64
          description: Expiry time (Unix seconds).
      required: [token, expiresAt]

    MintJoinTokenResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/MintJoinTokenResponse"

    # -- Location (beta) -------------------------------------------------
    LocationRequest:
      type: object
      required: [request_type]
      properties:
        supi:
          type: string
          description: "Subscriber identity (e.g. `imsi-001010000000001`). Required unless `request_type` is `cancel`."
        request_type:
          type: string
          enum: [immediate, periodic, triggered, cancel]
          description: Kind of location request.
        method:
          type: string
          enum: [cell_id, ecid]
          description: Positioning method. Defaults to `cell_id`.
        session_id:
          type: string
          description: Session to terminate. Required when `request_type` is `cancel`.
        qos_response_time_ms:
          type: integer
          description: Response time, in milliseconds.
        qos_horizontal_accuracy_m:
          type: integer
          description: Horizontal accuracy, in metres.

    LocationData:
      type: object
      description: Location estimate (TS 29.572 LocationData).
      properties:
        locationEstimate:
          $ref: "#/components/schemas/GeographicArea"
        accuracyFulfilmentIndicator:
          type: string
        ageOfLocationEstimate:
          type: integer
          format: int32
          description: Age of the estimate, in minutes.
        timestampOfLocationEstimate:
          type: string
          format: date-time
        positioningDataList:
          type: array
          items:
            $ref: "#/components/schemas/PositioningMethodAndUsage"
        ncgi:
          $ref: "#/components/schemas/LocNcgi"
        ecgi:
          $ref: "#/components/schemas/LocEcgi"
        tai:
          $ref: "#/components/schemas/LocTai"
        supplementaryMeasurements:
          $ref: "#/components/schemas/SupplementaryMeasurements"

    GeographicArea:
      type: object
      required: [shape]
      properties:
        shape:
          type: string
          enum: [POINT, POINT_UNCERTAINTY_CIRCLE]
        point:
          $ref: "#/components/schemas/GeographicalCoord"
        uncertainty:
          type: number
          description: Uncertainty radius, in metres.
        altitude:
          type: number

    GeographicalCoord:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          description: WGS-84 latitude in decimal degrees.
        lon:
          type: number
          description: WGS-84 longitude in decimal degrees.

    PositioningMethodAndUsage:
      type: object
      properties:
        method:
          type: string
        mode:
          type: string
        usage:
          type: string

    LocPlmn:
      type: object
      properties:
        mcc:
          type: string
        mnc:
          type: string

    LocNcgi:
      type: object
      properties:
        plmnId:
          $ref: "#/components/schemas/LocPlmn"
        nrCellId:
          type: string

    LocEcgi:
      type: object
      properties:
        plmnId:
          $ref: "#/components/schemas/LocPlmn"
        eutraCellId:
          type: string

    LocTai:
      type: object
      properties:
        plmnId:
          $ref: "#/components/schemas/LocPlmn"
        tac:
          type: string

    SupplementaryMeasurements:
      type: object
      description: "Raw NRPPa measurements. Only with `verbose=true`."
      properties:
        rsrp:
          type: integer
          format: int32
        rsrq:
          type: integer
          format: int32
        timingAdvance:
          type: integer
          format: int32
        ssRsrp:
          type: integer
          format: int32
        ssRsrq:
          type: integer
          format: int32
        csiRsrp:
          type: integer
          format: int32
        csiRsrq:
          type: integer
          format: int32
        nrTimingAdvance:
          type: integer
          format: int32
        ueRxTxTimeDiff:
          type: integer
          format: int32
        aoaAzimuthDegrees:
          type: number
        aoaZenithDegrees:
          type: number
        distanceMeters:
          type: number

    LocationDataResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/LocationData"

    PositioningSessionCreated:
      type: object
      properties:
        id:
          type: string
          description: Session ID.
      required: [id]

    PositioningSessionCreatedEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/PositioningSessionCreated"

    # -- Positioning Sessions (beta) -------------------------------------
    PositioningSessionListItem:
      type: object
      properties:
        id:
          type: string
        supi:
          type: string
        session_type:
          type: integer
          description: "0 = immediate, 1 = periodic, 2 = triggered."
        method:
          type: string
        status:
          type: integer
          description: "0 = active, 1 = completed, 2 = failed, 3 = cancelled."
        created_at:
          type: integer
          format: int64
          description: Creation time, Unix seconds.
        updated_at:
          type: integer
          format: int64
          description: Last update time, Unix seconds.
      required: [id, supi, session_type, method, status, created_at, updated_at]

    PositioningSessionDetail:
      type: object
      properties:
        id:
          type: string
        supi:
          type: string
        session_type:
          type: integer
          description: "0 = immediate, 1 = periodic, 2 = triggered."
        method:
          type: string
        status:
          type: integer
          description: "0 = active, 1 = completed, 2 = failed, 3 = cancelled."
        qos_response_time_ms:
          type: integer
        qos_horizontal_accuracy_m:
          type: integer
        last_result:
          $ref: "#/components/schemas/LocationData"
        created_at:
          type: integer
          format: int64
          description: Creation time, Unix seconds.
        updated_at:
          type: integer
          format: int64
          description: Last update time, Unix seconds.
      required: [id, supi, session_type, method, status, created_at, updated_at]

    ListPositioningSessionsResponseEnvelope:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/PositioningSessionListItem"

    PositioningSessionDetailResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/PositioningSessionDetail"

    # -- Cell Positions (beta) -------------------------------------------
    CellPositionRequest:
      type: object
      required: [rat, mcc, mnc, cell_identity, latitude, longitude]
      properties:
        rat:
          type: string
          enum: [nr, eutra]
          description: Radio access technology.
        mcc:
          type: string
        mnc:
          type: string
        cell_identity:
          type: string
          description: Hex cell identity (NCI for NR, ECI for E-UTRA).
        gnb_id:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS-84 latitude in decimal degrees.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS-84 longitude in decimal degrees.
        altitude:
          type: number
        uncertainty_semi_major:
          type: number
          description: Semi-major axis of the uncertainty ellipse, in metres.
        uncertainty_semi_minor:
          type: number
          description: Semi-minor axis of the uncertainty ellipse, in metres.
        orientation_major:
          type: integer
          description: Orientation of the semi-major axis, in degrees.
        confidence:
          type: integer
          description: Confidence, in percent.

    CellPosition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rat:
          type: string
          enum: [nr, eutra]
        mcc:
          type: string
        mnc:
          type: string
        cell_identity:
          type: string
        gnb_id:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        altitude:
          type: number
        uncertainty_semi_major:
          type: number
        uncertainty_semi_minor:
          type: number
        orientation_major:
          type: integer
        confidence:
          type: integer
        source:
          type: string
          description: Origin of the record (e.g. `provisioned`).
      required: [id, rat, mcc, mnc, cell_identity, latitude, longitude, source]

    CellPositionResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/CellPosition"

    ListCellPositionsResponseEnvelope:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/CellPosition"

    CreateCellPositionResponseEnvelope:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/CreateSuccessResponse"

          in: query
          schema:
            type: string
          description: Filter by subscriber IMSI.
        - name: protocol
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 255
          description: Filter by IP protocol number (e.g. 6 for TCP, 17 for UDP).
        - name: source
          in: query
          schema:
            type: string
          description: "Filter by source. Accepts: IP, IP:port, or :port."
        - name: destination
          in: query
          schema:
            type: string
          description: "Filter by destination. Accepts: IP, IP:port, or :port."
        - name: direction
          in: query
          schema:
            type: string
            enum: [uplink, downlink]
          description: Filter by traffic direction.
        - name: action
          in: query
          schema:
            type: string
            enum: [allow, drop]
          description: Filter by flow action.
        - name: start
          in: query
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound (RFC 3339). Defaults to 7 days ago.
        - name: end
          in: query
          schema:
            type: string
            format: date-time
          description: Exclusive upper bound (RFC 3339). Defaults to now.

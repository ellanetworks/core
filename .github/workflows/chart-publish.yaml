name: Helm Chart Publish

permissions:
  contents: read
  packages: write

on:
  workflow_call:

env:
  HELM_VERSION: v4.3.1
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
  REGISTRY: oci://ghcr.io/ellanetworks/charts

jobs:
  publish-chart:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Helm
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$HELM_SHA256" "$RUNNER_TEMP/helm.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"

      - name: Package
        run: |
          version="$(cat version/VERSION)"
          helm package charts/ella-core --version "${version#v}" --app-version "${version}" --destination "$RUNNER_TEMP/dist"

      - name: Push
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP"/dist/ella-core-*.tgz "$REGISTRY"

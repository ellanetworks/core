name: Integration tests (4G srsRAN)

permissions:
  contents: read

on:
  workflow_call:

jobs:
  # The srsRAN soft-radio (gradiant/srsran-4g) is amd64-only over IPv4 ZMQ, so this
  # job is amd64 + IPv4 only. Multi-arch/family 4G runs in integration-tests-4g.
  integration-test-4g-srsran:
    strategy:
      fail-fast: false
      matrix:
        attach_mode: [xdp-generic, tcx]
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker registry
        run: |
          docker run -d -p 5000:5000 --name registry registry:2

      - name: Download Ella Core image from GitHub Artifact
        uses: actions/download-artifact@v8
        with:
          name: ellacore-image-amd64

      - name: Download Ella Core Tester image from GitHub Artifact
        uses: actions/download-artifact@v8
        with:
          name: ellacore-tester-image-amd64

      - name: Load images into Docker
        run: |
          docker load -i ellacore_latest-amd64.tar
          docker tag ella-core:latest localhost:5000/ella-core:latest
          docker push localhost:5000/ella-core:latest
          docker load -i ellacore_tester_latest-amd64.tar

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      # Exclude TestIntegration4GHA*: they also match -run 'TestIntegration4G'
      # but run in integration-tests-ha-4g with their own 3-node cluster.
      - name: Run 4G srsRAN integration tests
        env:
          INTEGRATION: "1"
          ELLA_CORE_ATTACH_MODE: ${{ matrix.attach_mode }}
          IP_VERSION: ipv4
          INTEGRATION_LOG_DIR: ${{ runner.temp }}/integration-logs
        run: |
          go test ./integration/... -run 'TestIntegration4G' -skip 'TestIntegration4GHA|TestIntegration4GNetworkRules|TestIntegration4GUE2UE' -timeout 30m -v

      - name: Upload cluster logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-4g-srsran-cluster-logs-${{ matrix.attach_mode }}
          path: ${{ runner.temp }}/integration-logs
          if-no-files-found: ignore
          retention-days: 7

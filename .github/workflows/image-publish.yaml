name: Image Publish

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      kind:
        description: "release (version, minor and latest tags) or main (main and sha tags)"
        type: string
        required: true

env:
  IMAGE: ghcr.io/ellanetworks/ella-core

jobs:
  publish-image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: ellacore-image-${{ matrix.arch }}

      - name: Import and push to github package (${{ matrix.arch }})
        env:
          KIND: ${{ inputs.kind }}
          ARCH: ${{ matrix.arch }}
        run: |
          case "$KIND" in
            release) base="$(cat version/VERSION)" ;;
            main) base="sha-${GITHUB_SHA::12}" ;;
            *) echo "unknown kind: $KIND" >&2; exit 1 ;;
          esac

          docker load -i "ellacore_latest-${ARCH}.tar"

          docker tag ella-core:latest "${IMAGE}:${base}-${ARCH}"

          docker push "${IMAGE}:${base}-${ARCH}"

  make-manifest:
    needs: publish-image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        env:
          KIND: ${{ inputs.kind }}
        run: |
          case "$KIND" in
            release)
              base="$(cat version/VERSION)"
              tags=("$base" "${base%.*}" latest)
              ;;
            main)
              base="sha-${GITHUB_SHA::12}"
              tags=("$base" main)
              ;;
            *) echo "unknown kind: $KIND" >&2; exit 1 ;;
          esac

          for tag in "${tags[@]}"; do
            docker manifest create "${IMAGE}:${tag}" \
              "${IMAGE}:${base}-amd64" \
              "${IMAGE}:${base}-arm64"
            docker manifest push "${IMAGE}:${tag}"
          done

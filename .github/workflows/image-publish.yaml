name: Image Publish

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

on:
  workflow_call:

jobs:
  publish-image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: ellacore-image-${{ matrix.arch }}

      - name: Import and push to github package (${{ matrix.arch }})
        id: push
        run: |
          version="$(cat version/VERSION)"

          docker load -i ellacore_latest-${{ matrix.arch }}.tar

          docker tag ella-core:latest ghcr.io/ellanetworks/ella-core:${version}-${{ matrix.arch }}

          docker push ghcr.io/ellanetworks/ella-core:${version}-${{ matrix.arch }} | tee push.log

          digest="$(awk '/digest: sha256:/ {for (i=1; i<=NF; i++) if ($i ~ /^sha256:/) print $i}' push.log)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (${{ matrix.arch }})
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ella-core:latest
          format: spdx-json
          output-file: sbom-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM (${{ matrix.arch }})
        uses: actions/attest-sbom@v4
        with:
          subject-name: ghcr.io/ellanetworks/ella-core
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.arch }}.spdx.json
          push-to-registry: true

  make-manifest:
    needs: publish-image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          version="$(cat version/VERSION)"

          docker manifest create ghcr.io/ellanetworks/ella-core:${version} \
            ghcr.io/ellanetworks/ella-core:${version}-amd64 \
            ghcr.io/ellanetworks/ella-core:${version}-arm64

          docker manifest create ghcr.io/ellanetworks/ella-core:latest \
            ghcr.io/ellanetworks/ella-core:${version}-amd64 \
            ghcr.io/ellanetworks/ella-core:${version}-arm64

          docker manifest push ghcr.io/ellanetworks/ella-core:${version}
          docker manifest push ghcr.io/ellanetworks/ella-core:latest

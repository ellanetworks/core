name: Image Publish

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      kind:
        description: "release (version, minor and latest tags) or main (main and sha tags)"
        type: string
        required: true
      artifact:
        description: "Prefix of the image artifacts, one per architecture"
        type: string
        default: ellacore-image
      tag-suffix:
        description: "Suffix appended to every tag, e.g. -ubi"
        type: string
        default: ""

env:
  IMAGE: ghcr.io/ellanetworks/ella-core

jobs:
  publish-image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}-${{ matrix.arch }}

      - name: Import and push to github package (${{ matrix.arch }})
        env:
          KIND: ${{ inputs.kind }}
          ARCH: ${{ matrix.arch }}
          SUFFIX: ${{ inputs.tag-suffix }}
        run: |
          case "$KIND" in
            release) base="$(cat version/VERSION)${SUFFIX}" ;;
            main) base="sha-${GITHUB_SHA::12}${SUFFIX}" ;;
            *) echo "unknown kind: $KIND" >&2; exit 1 ;;
          esac

          docker load -i "ellacore_latest-${ARCH}.tar"

          docker tag ella-core:latest "${IMAGE}:${base}-${ARCH}"

          docker push "${IMAGE}:${base}-${ARCH}"

  make-manifest:
    needs: publish-image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        id: manifest
        env:
          KIND: ${{ inputs.kind }}
          SUFFIX: ${{ inputs.tag-suffix }}
        run: |
          case "$KIND" in
            release)
              version="$(cat version/VERSION)"
              base="${version}${SUFFIX}"
              tags=("$base" "${version%.*}${SUFFIX}" "latest${SUFFIX}")
              ;;
            main)
              base="sha-${GITHUB_SHA::12}${SUFFIX}"
              tags=("$base" "main${SUFFIX}")
              ;;
            *) echo "unknown kind: $KIND" >&2; exit 1 ;;
          esac

          for tag in "${tags[@]}"; do
            docker manifest create "${IMAGE}:${tag}" \
              "${IMAGE}:${base}-amd64" \
              "${IMAGE}:${base}-arm64"
            docker manifest push "${IMAGE}:${tag}"
          done

          digest="$(docker buildx imagetools inspect "${IMAGE}:${base}" --format '{{json .Manifest}}' | jq -r .digest)"
          if [[ "${digest}" != sha256:* ]]; then
            echo "::error::could not resolve the index digest of ${IMAGE}:${base}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        id: install-cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install cosign (retry)
        if: steps.install-cosign.outcome == 'failure'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          delay=10
          for attempt in 1 2 3 4 5; do
            if cosign sign --yes --recursive "${IMAGE}@${DIGEST}"; then
              exit 0
            fi
            echo "signing attempt ${attempt} failed"
            if [ "${attempt}" -lt 5 ]; then
              sleep "${delay}"
              delay=$((delay * 2))
            fi
          done
          echo "::error::could not sign ${IMAGE}@${DIGEST}"
          exit 1

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (retry)
        if: steps.sbom.outcome == 'failure'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Verify signature and attestations
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image-publish.yaml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify "oci://${IMAGE}@${DIGEST}" -R "${GITHUB_REPOSITORY}"
          spdx_version="$(jq -r .spdxVersion sbom.spdx.json)"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" -R "${GITHUB_REPOSITORY}" --predicate-type "https://spdx.dev/Document/v${spdx_version#SPDX-}"

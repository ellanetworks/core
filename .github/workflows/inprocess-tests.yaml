name: In-process Tests

permissions:
  contents: read

on:
  workflow_call:

jobs:
  inprocess-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ELLA_TEST_TIMEOUT_MULTIPLIER: "3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install libpcap headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: In-process system tests
        run: go test -race -count=1 -timeout 30m -v ./integration/inprocess/...

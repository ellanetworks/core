name: Integration tests

permissions:
  contents: read
  packages: read

on:
  workflow_call:

jobs:
  discover:
    name: Discover suites
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      legs: ${{ steps.list.outputs.legs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - id: list
        run: |
          legs=$(go run ./integration/suites/legs)
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.name }}
    needs: discover
    runs-on: ${{ (matrix.arch == 'arm64' && 'ubuntu-26.04-arm') || 'ubuntu-26.04' }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      SMSC_UNAVAILABLE: ${{ matrix.needs_smsc && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.legs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Ella Core image
        uses: actions/download-artifact@v8
        with:
          name: ellacore-image-${{ matrix.arch }}

      - name: Download Ella Core Tester image
        if: ${{ matrix.needs_tester }}
        uses: actions/download-artifact@v8
        with:
          name: ellacore-tester-image-${{ matrix.arch }}

      - name: Load images into Docker
        run: |
          docker load -i ellacore_latest-${{ matrix.arch }}.tar
          if [ "${{ matrix.needs_tester }}" = "true" ]; then
            docker load -i ellacore_tester_latest-${{ matrix.arch }}.tar
          fi

      - name: Skip the SMSC suite on forks
        if: ${{ env.SMSC_UNAVAILABLE == 'true' }}
        run: |
          echo "::notice::Skipping ${{ matrix.suite }}, pull requests from forks cannot pull the private SMSC image."

      - name: Log in to the Container registry
        if: ${{ matrix.needs_smsc && env.SMSC_UNAVAILABLE != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Ella SMSC image
        if: ${{ matrix.needs_smsc && env.SMSC_UNAVAILABLE != 'true' }}
        run: docker pull ghcr.io/ellanetworks/ella-smsc:latest

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Suite setup
        if: ${{ matrix.setup != '' }}
        run: ${{ matrix.setup }}

      - name: Run ${{ matrix.suite }}
        if: ${{ env.SMSC_UNAVAILABLE != 'true' }}
        env:
          INTEGRATION: "1"
          VRF: ${{ matrix.topology == 'vrf' && '1' || '' }}
          ELLA_CORE_ATTACH_MODE: ${{ matrix.attach_mode }}
          IP_VERSION: ${{ matrix.ip_version }}
          INTEGRATION_LOG_DIR: ${{ runner.temp }}/integration-logs
          SUITE_RUN: ${{ matrix.run }}
          SUITE_SKIP: ${{ matrix.skip }}
          SUITE_TIMEOUT: ${{ matrix.timeout }}
        run: |
          args=(./integration/... -run "$SUITE_RUN" -timeout "$SUITE_TIMEOUT" -v)
          if [ -n "$SUITE_SKIP" ]; then
            args+=(-skip "$SUITE_SKIP")
          fi
          go test "${args[@]}"

      - name: Upload cluster logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs-${{ matrix.suite }}-${{ matrix.arch }}-${{ matrix.ip_version }}-${{ matrix.attach_mode }}
          path: ${{ runner.temp }}/integration-logs
          if-no-files-found: ignore
          retention-days: 7

name: Release workflow

permissions:
  contents: read
  packages: write
  security-events: write

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  image-build:
    uses: ./.github/workflows/image-build.yaml
  image-publish:
    needs: [image-build]
    uses: ./.github/workflows/image-publish.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      kind: release
    secrets: inherit
  image-scan:
    needs: [image-build, image-publish]
    uses: ./.github/workflows/image-scan.yaml
  chart-publish:
    needs: [image-publish]
    uses: ./.github/workflows/chart-publish.yaml
    permissions:
      contents: read
      packages: write
  snap-build:
    uses: ./.github/workflows/snap-build.yaml
  snap-strict-test:
    needs: [snap-build]
    uses: ./.github/workflows/snap-strict-test.yaml
  snap-publish:
    needs: [snap-build, snap-strict-test]
    uses: ./.github/workflows/snap-publish.yaml
    secrets: inherit
  binary-build:
    uses: ./.github/workflows/binary-build.yaml
  binary-publish:
    if: github.event_name == 'release'
    needs: [binary-build]
    uses: ./.github/workflows/binary-publish.yaml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ github.event.release.tag_name }}

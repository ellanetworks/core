name: Image Build

permissions:
  contents: read

on:
  workflow_call:

jobs:
  build-image:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ (matrix.arch == 'arm64' && 'ubuntu-26.04-arm') || 'ubuntu-26.04' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: canonical/craft-actions/rockcraft/pack@cff22ebcc23e0aacd49a6a6bc7e1c6ba5b33d99c # main
        id: rockcraft
        with:
          channel: stable

      - name: Save container image to file
        run: |
          rock_file=$(ls *.rock | tail -n 1)
          sudo rockcraft.skopeo --insecure-policy copy oci-archive:"${rock_file}" docker-daemon:ella-core:latest
          docker save -o ellacore_latest-${{ matrix.arch }}.tar ella-core:latest

      - name: Upload container image to GitHub Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ellacore-image-${{ matrix.arch }}
          path: ellacore_latest-${{ matrix.arch }}.tar

name: Run Gosec

permissions:
  contents: read

on:
    workflow_call:

jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install libpcap headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.24.7

      - name: Run Gosec
        run: gosec -exclude=G103,G115,G117 ./...

      - name: Sub-module gosec
        run: |
          set -e
          for modfile in $(find . -name go.mod -not -path './go.mod' -not -path './ui/*'); do
            dir=$(dirname "$modfile")
            echo "::group::gosec in $dir"
            (cd "$dir" && gosec -exclude=G103,G115,G117 ./...)
            echo "::endgroup::"
          done

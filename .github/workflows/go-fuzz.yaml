name: Go Fuzz

# Checked-in seed corpora are replayed by the ordinary unit-test run. This job
# searches for new inputs, which needs wall-clock time rather than a PR gate.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - id: list
        run: echo "targets=$(.github/scripts/list-fuzz-targets.sh)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: discover
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.dir }}
        run: go test ${{ matrix.pkg }} -run=xxx -fuzz='^${{ matrix.target }}$' -fuzztime=5m

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.dir }}-${{ matrix.target }}-corpus
          path: ${{ matrix.dir }}/**/testdata/fuzz/

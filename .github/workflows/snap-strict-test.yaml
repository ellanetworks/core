name: Snap Strict Confinement Test

permissions:
  contents: read

on:
  workflow_call:

jobs:
  snap-build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 #v1.3.0
        id: build

      - name: Upload the snap
        uses: actions/upload-artifact@v7
        with:
          name: ella-core-snap
          path: ${{ steps.build.outputs.snap }}

  snap-install:
    needs: snap-build
    strategy:
      fail-fast: false
      matrix:
        attach_mode: [xdp-generic, tcx]
    runs-on: ubuntu-26.04
    steps:
      - name: Download the snap
        uses: actions/download-artifact@v8
        with:
          name: ella-core-snap

      - name: Install the snap under strict confinement
        run: |
          sudo snap install --dangerous ./*.snap
          snap list ella-core

      - name: Require strict confinement to be enforced
        # Without this, a runner running the snap unconfined would let the test
        # pass even if a plug/permission were missing.
        run: |
          mode="$(sudo snap debug confinement)"
          echo "system confinement: ${mode}"
          if [ "${mode}" != "strict" ]; then
            echo "::error::runner does not enforce strict confinement (${mode}); cannot validate the snap"
            exit 1
          fi

      - name: Connect the snap plugs
        run: |
          for plug in network-control process-control system-observe firewall-control mount-observe; do
            sudo snap connect ella-core:"${plug}"
          done

      - name: Provision test interfaces and configuration
        run: |
          sudo ip link add ella-n2 type dummy
          sudo ip addr add 10.3.0.2/24 dev ella-n2
          sudo ip link set ella-n2 up
          sudo ip link add ella-n3 type veth peer name ella-n3-peer
          sudo ip link add ella-n6 type veth peer name ella-n6-peer
          sudo ip addr add 10.5.0.1/24 dev ella-n3
          sudo ip addr add 10.6.0.1/24 dev ella-n6
          for dev in ella-n3 ella-n3-peer ella-n6 ella-n6-peer; do
            sudo ip link set "${dev}" up
          done
          # The snap ships xdp-native, which cannot attach to a veth, so the
          # mode is overridden here.
          cfg=/var/snap/ella-core/common/core.yaml
          sudo yq -i '
            .interfaces.n2.address = "10.3.0.2" |
            .interfaces.n3.name = "ella-n3" |
            .interfaces.n6.name = "ella-n6" |
            .datapath."attach-mode" = "${{ matrix.attach_mode }}" |
            .logging.system.level = "debug"
          ' "${cfg}"

      - name: Start the datapath daemon
        run: sudo snap start ella-core.cored

      - name: Assert the service runs properly
        run: |
          # Polled rather than slept: readiness is the last step of startup, so
          # how long it takes, and what the status says while it is pending,
          # are what distinguish a slow start from a stuck one. A failed eBPF
          # load is fatal and restarts the unit, so restarts are checked each
          # round rather than once.
          deadline=$((SECONDS + 60))
          status=""
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            restarts="$(systemctl show -p NRestarts --value snap.ella-core.cored)"
            if [ "${restarts}" != "0" ]; then
              echo "::error::ella-core.cored crashed/restarted under strict confinement (${restarts} restarts)"
              exit 1
            fi

            status="$(curl -sk --max-time 5 https://127.0.0.1:5002/api/v1/status || echo '<no response>')"
            echo "t=${SECONDS}s restarts=${restarts} status: ${status}"

            if echo "${status}" | grep -q '"ready":true'; then
              echo "ready after ${SECONDS}s"
              exit 0
            fi

            sleep 2
          done
          echo "::error::ella-core.cored never became ready; last status: ${status}"
          exit 1

      - name: Assert the datapath attached at the requested hook
        run: |
          status="$(curl -sk --max-time 10 https://127.0.0.1:5002/api/v1/status)"
          mode="$(echo "${status}" | jq -r '.result.datapathAttachMode // ""')"
          echo "datapath attach mode: ${mode}"
          if [ "${mode}" != "${{ matrix.attach_mode }}" ]; then
            echo "::error::datapath attached as '${mode}', want '${{ matrix.attach_mode }}'"
            sudo snap logs ella-core.cored -n all || true
            exit 1
          fi

      # Startup stops logging once it blocks, so the log alone cannot say where.
      # These answer the questions it leaves open: did the datapath load, was a
      # confinement rule refused, and what is the process actually waiting on.
      - name: Diagnose a failed start
        if: failure()
        run: |
          echo "::group::service state"
          systemctl status snap.ella-core.cored --no-pager -l || true
          systemctl show snap.ella-core.cored -p NRestarts -p ActiveState -p SubState -p ExecMainPID || true
          echo "::endgroup::"

          echo "::group::AppArmor and kernel denials"
          sudo dmesg | grep -iE "apparmor|denied|bpf" | tail -50 || true
          sudo journalctl -k --no-pager -n 100 | grep -iE "apparmor|denied" || true
          echo "::endgroup::"

          echo "::group::loaded BPF objects"
          sudo bpftool prog show 2>/dev/null || echo "bpftool unavailable"
          sudo bpftool map show 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::goroutine stacks"
          # SIGQUIT makes the Go runtime dump every goroutine to stderr, which
          # lands in the journal. This is what names the blocking call. It kills
          # the process, so it runs only after the run has already failed.
          pid="$(systemctl show -p ExecMainPID --value snap.ella-core.cored)"
          echo "main pid: ${pid}"
          if [ -n "${pid}" ] && [ "${pid}" != "0" ]; then
            sudo cat "/proc/${pid}/status" 2>/dev/null | grep -E "State|Threads" || true
            sudo kill -QUIT "${pid}" || true
            sleep 5
          fi
          echo "::endgroup::"

      - name: Dump daemon logs
        if: always()
        run: sudo snap logs ella-core.cored -n all || true

name: Go Race Detection Tests

permissions:
  contents: read

on:
  workflow_call:

jobs:
  go-race-detection-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install libpcap headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Race detection tests
        run: go test -race ./...

      - name: Sub-module race detection tests
        run: |
          set -e
          for modfile in $(find . -name go.mod -not -path './go.mod' -not -path './ui/*'); do
            dir=$(dirname "$modfile")
            echo "::group::race detection tests in $dir"
            (cd "$dir" && go test -race ./...)
            echo "::endgroup::"
          done

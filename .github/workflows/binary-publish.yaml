name: Binary Publish

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to upload the binaries to"
        type: string
        required: true

jobs:
  publish-binary:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the tarballs and SBOMs
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Resolve the file names
        id: files
        run: |
          version="$(cat version/VERSION)"
          if [ "${version}" != "${TAG}" ]; then
            echo "::error::release tag ${TAG} does not match version/VERSION ${version}"
            exit 1
          fi
          for arch in amd64 arm64; do
            name="ella-core-${version}-linux-${arch}"
            for f in "dist/${name}.tar.gz" "dist/${name}.spdx.json"; do
              if [ ! -f "${f}" ]; then
                echo "::error::missing ${f}"
                exit 1
              fi
            done
            echo "${arch}=dist/${name}" >> "$GITHUB_OUTPUT"
          done

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Attest SBOM (amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.amd64 }}.tar.gz
          sbom-path: ${{ steps.files.outputs.amd64 }}.spdx.json

      - name: Attest SBOM (arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.arm64 }}.tar.gz
          sbom-path: ${{ steps.files.outputs.arm64 }}.spdx.json

      - name: Write checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz ./*.spdx.json | sed 's| \./| |' > SHA256SUMS

      - name: Install cosign
        id: install-cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install cosign (retry)
        if: steps.install-cosign.outcome == 'failure'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the checksums
        working-directory: dist
        run: |
          delay=10
          for attempt in 1 2 3 4 5; do
            if cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS; then
              exit 0
            fi
            echo "signing attempt ${attempt} failed"
            if [ "${attempt}" -lt 5 ]; then
              sleep "${delay}"
              delay=$((delay * 2))
            fi
          done
          echo "::error::could not sign SHA256SUMS"
          exit 1

      - name: Verify checksums, signature and attestations
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/binary-publish.yaml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for f in ./*.tar.gz; do
            gh attestation verify "${f}" -R "${GITHUB_REPOSITORY}"
            spdx_version="$(jq -r .spdxVersion "${f%.tar.gz}.spdx.json")"
            gh attestation verify "${f}" -R "${GITHUB_REPOSITORY}" --predicate-type "https://spdx.dev/Document/v${spdx_version#SPDX-}"
          done

      - name: Upload to the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" ./*.tar.gz ./*.spdx.json SHA256SUMS SHA256SUMS.sigstore.json --clobber -R "${GITHUB_REPOSITORY}"

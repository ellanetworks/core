name: Integration tests (UE-to-UE 5G)

permissions:
  contents: read

on:
  workflow_call:

jobs:
  integration-test-ue2ue-5g:
    strategy:
      fail-fast: false
      matrix:
        ip_version: [ipv4]
        attach_mode: [xdp-generic, tcx]
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker registry
        run: |
          docker run -d -p 5000:5000 --name registry registry:2

      - name: Download Ella Core image from GitHub Artifact
        uses: actions/download-artifact@v8
        with:
          name: ellacore-image-amd64

      - name: Download Ella Core Tester image from GitHub Artifact
        uses: actions/download-artifact@v8
        with:
          name: ellacore-tester-image-amd64

      - name: Load images into Docker
        run: |
          docker load -i ellacore_latest-amd64.tar
          docker tag ella-core:latest localhost:5000/ella-core:latest
          docker push localhost:5000/ella-core:latest
          docker load -i ellacore_tester_latest-amd64.tar

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Run UE-to-UE 5G integration test
        env:
          INTEGRATION: "1"
          ELLA_CORE_ATTACH_MODE: ${{ matrix.attach_mode }}
          IP_VERSION: ${{ matrix.ip_version }}
          INTEGRATION_LOG_DIR: ${{ runner.temp }}/ue2ue-logs
        run: |
          go test ./integration/... -run TestIntegration5GUE2UE -timeout 20m -v

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-ue2ue-5g-logs-${{ matrix.ip_version }}
          path: ${{ runner.temp }}/ue2ue-logs
          if-no-files-found: ignore
          retention-days: 7

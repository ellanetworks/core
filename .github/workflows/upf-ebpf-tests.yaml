name: UPF eBPF Unit Tests

permissions:
  contents: read

on:
  workflow_call:

jobs:
  upf-ebpf-tests:
    # Load and run the XDP datapath on each runner's stock kernel so the verifier
    # (program-too-complex, map/feature support) is exercised per runner image.
    # Both images currently ship a 6.8 HWE kernel; the uname step below records
    # what each run actually used. A container shares the host kernel and cannot
    # substitute for this.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install libpcap headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Kernel version
        run: uname -a

      # scripts/netns-exec.sh runs each test binary in a fresh network
      # namespace: the fixtures create veth pairs and flip forwarding
      # sysctls, which stay contained there.
      - name: Run UPF eBPF datapath and engine tests (generic XDP fixtures)
        run: go test -v -exec "sudo --preserve-env=EBPF_REQUIRE_PRIVILEGED $PWD/scripts/netns-exec.sh" ./internal/upf/ebpf/... ./internal/upf/... ./internal/upf/engine/...
        env:
          EBPF_REQUIRE_PRIVILEGED: "1"

      - name: Run UPF eBPF datapath tests (TCX fixtures)
        run: go test -v -exec "sudo --preserve-env=EBPF_REQUIRE_PRIVILEGED $PWD/scripts/netns-exec.sh env ELLA_TEST_ATTACH_MODE=tcx" ./internal/upf/ebpf/...
        env:
          EBPF_REQUIRE_PRIVILEGED: "1"

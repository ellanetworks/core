name: UPF eBPF Unit Tests

permissions:
  contents: read

on:
  workflow_call:

jobs:
  upf-ebpf-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install libpcap headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Kernel version
        run: uname -a

      # The fixtures create veth pairs and set forwarding sysctls, which are
      # per-namespace: running each test binary in a private netns keeps them
      # off the runner. `go test -exec` splits its value on spaces, so the
      # unshare invocation cannot be written inline.
      - name: Write network namespace wrapper
        run: |
          cat > "$RUNNER_TEMP/netns-exec.sh" <<'WRAPPER'
          #!/bin/sh
          exec unshare --net sh -c 'ip link set lo up && exec "$@"' -- "$@"
          WRAPPER
          chmod +x "$RUNNER_TEMP/netns-exec.sh"

      - name: Run UPF eBPF datapath and engine tests (XDP fixtures)
        run: go test -v -exec "sudo --preserve-env=EBPF_REQUIRE_PRIVILEGED $RUNNER_TEMP/netns-exec.sh" ./internal/upf/ebpf/... ./internal/upf/... ./internal/upf/engine/...
        env:
          EBPF_REQUIRE_PRIVILEGED: "1"

      - name: Run UPF eBPF datapath tests (TCX fixtures)
        run: go test -v -exec "sudo --preserve-env=EBPF_REQUIRE_PRIVILEGED $RUNNER_TEMP/netns-exec.sh env ELLA_TEST_ATTACH_MODE=tcx" ./internal/upf/ebpf/...
        env:
          EBPF_REQUIRE_PRIVILEGED: "1"

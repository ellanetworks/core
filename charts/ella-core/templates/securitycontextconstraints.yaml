{{- if include "ella-core.openshiftSCC" . }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ include "ella-core.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "ella-core.labels" . | nindent 4 }}
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
  - NET_ADMIN
  - NET_RAW
  - NET_BIND_SERVICE
  - BPF
  - PERFMON
  - SYS_RESOURCE
requiredDropCapabilities: []
defaultAddCapabilities: []
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - persistentVolumeClaim
  - projected
  - secret
  - emptyDir
  - downwardAPI
users: []
groups: []
priority: null
{{- end }}

{{- if include "ella-core.openshiftSCC" . }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ include "ella-core.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "ella-core.labels" . | nindent 4 }}
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
  - NET_ADMIN
  - NET_RAW
  - NET_BIND_SERVICE
  - BPF
  - PERFMON
  - SYS_RESOURCE
requiredDropCapabilities: []
defaultAddCapabilities: []
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - persistentVolumeClaim
  - projected
  - secret
  - emptyDir
  - downwardAPI
users: []
groups: []
priority: null
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ella-core.fullname" . }}-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-core.labels" . | nindent 4 }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: [{{ printf "%s-%s" (include "ella-core.fullname" .) .Release.Namespace | quote }}]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ella-core.fullname" . }}-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-core.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ella-core.fullname" . }}-scc
subjects:
  - kind: ServiceAccount
    name: {{ include "ella-core.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if include "ella-core.openshiftSCC" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ella-core.fullname" . }}-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-core.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ella-core.fullname" . }}-scc
subjects:
  - kind: ServiceAccount
    name: {{ include "ella-core.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
